function armUpdate(A, dt){
  const T=THREE, P=A.P, goal=A.goal?A.goal():armRest(A);
  const sh=P.torso.localToWorld(new T.Vector3(A.side*.2,.53,-.06));
  const p=goal.p.clone();
  const ap=(goal.ap?goal.ap.clone():p.clone().sub(sh.clone().add(new T.Vector3(0,-.14,0)))).normalize();
  const q=new T.Quaternion().setFromRotationMatrix(new T.Matrix4().lookAt(p, p.clone().sub(ap), new T.Vector3(0,1,0)));
  const roll=(goal.roll||0)+A.twist; if(roll) q.multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0,0,1),roll));
  const c=CONTACT[goal.pose], flip=(goal.pose==='point'||goal.pose==='pinch')?A.hand.side:1;
  if(A.press) p.addScaledVector(ap,.014*A.press);
  const wristD=p.sub(new T.Vector3(c[0]*flip,c[1],c[2]).applyQuaternion(q));
  const k=A.init?1-Math.exp(-dt*(A.goal?9:6)):1; A.init=true;
  A.wrist.lerp(wristD,k); A.q.slerp(q,k);
  const L1=A.L1, L2=A.L2, maxL=L1+L2-.004, d=A.wrist.clone().sub(sh); let len=d.length();
  A.lean=Math.max(0,len-maxL); len=Math.min(len,maxL);
  const dir=d.normalize(), ang=Math.acos(Math.max(-1,Math.min(1,(L1*L1+len*len-L2*L2)/(2*L1*len))));
  const pole=new T.Vector3(A.side*.38,-.55,.2), ortho=pole.sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const elbow=sh.clone().addScaledVector(dir,Math.cos(ang)*L1).addScaledVector(ortho,Math.sin(ang)*L1), wrist=sh.clone().addScaledVector(dir,len);
  G3.place(A.upper,sh,elbow); G3.place(A.fore,elbow,wrist); A.elbowS.position.copy(elbow); A.shoulderS.position.copy(sh);
  A.cuff.position.copy(wrist).addScaledVector(elbow.clone().sub(wrist).normalize(),.03); A.cuff.quaternion.copy(A.fore.quaternion);
  if(A.pocket){ const m=sh.clone().lerp(elbow,.45).add(new T.Vector3(-.05,0,0)); A.pocket.position.copy(m); A.pocket.quaternion.copy(A.upper.quaternion); A.pens.forEach((pn,i)=>{ pn.position.copy(m).add(new T.Vector3(-.006,.045,(i-.5)*.012).applyQuaternion(A.upper.quaternion)); pn.quaternion.copy(A.upper.quaternion); }); }
  const H=A.hand; H.obj.position.copy(wrist); H.obj.quaternion.copy(A.q);

  H.F.forEach((js,i)=>js.forEach((j,n)=>{ H.cur.f[i][n]+=(pose.f[i][n]-H.cur.f[i][n])*kk; j.rotation.x=H.cur.f[i][n]; }));

}
function personUpdate(P, dt, now){

  P.lean+=(P.leanT-P.lean)*Math.min(1,dt*5); P.torso.rotation.x=-P.lean+Math.sin(now/1000*1.6)*.006;
  if(!P.head) return;

  const T=THREE, inst=S.simInstr!==false, mood=inst&&now<P.moodUntil?P.mood:'neutral';
  const tgt=(mood==='glare'||mood==='ok'||(inst&&now<P.talkUntil&&P.faceYou))?G3.camera.position.clone():P.lookT;
  P.look.lerp(tgt,1-Math.exp(-dt*5));
  const np=P.neck.getWorldPosition(new T.Vector3()), d=P.look.clone().sub(np);
  const yaw=Math.max(-1.3,Math.min(1.3,Math.atan2(-d.x,-d.z))), pitch=Math.max(-.6,Math.min(.4,Math.atan2(d.y,Math.hypot(d.x,d.z))));

}

// ---- camera lean: move the head toward something to read it ----
function camLean(p, dist=.3, fov=42){
  // First-person: stay in the pilot's seat, lean a little toward the control and zoom in on it,
  // so every action is seen from the front, the way you'd look at it yourself.
  const T=THREE, c=G3.cam, e=new T.Vector3(...EYE.me), d=p.clone().sub(e), L=d.length();
  const lean=Math.min(.15, L*.28), pos=e.clone().addScaledVector(d.clone().normalize(), lean);
  pos.y=Math.max(pos.y, 1.02);
  // reaching for low controls bends the body forward, so the eye moves ahead of the chest (still facing the panel)
  if(p.y<.8){ pos.set(e.x+(p.x-e.x)*.35, 1.1, Math.min(.36, p.z+.42)); }
  const span=dist>.3?.62:.4;                                  // how much of the panel to keep in frame
  const f=2*Math.atan(span/2/Math.max(.15, p.distanceTo(pos)))*180/Math.PI;
  c.mode='in'; c.lean={pos, look:p.clone()}; c.tFov=Math.max(30, Math.min(58, f));
}

// ---- 3D perform: look, reach with the right hand pose, operate, return ----
async function perform3d(c, who){
  const s=SIM, g=G3, T=THREE, tok=++s.anim, alive=()=>SIM===s && s.anim===tok;
  const t=c.c?targetOf(c.it,c.c):{k:'say'}, inst=g.people.inst;
  const outside=s.cl.id==='external' || (s.cl.id==='safety' && !c.c);
  if(outside){ camOutside(c.it.head||''); await sleep(1600); return alive(); }
  if(g.cam.mode!=='in') camInside();
  if(!c.c){ inst.lookT=g.camera.position.clone(); await sleep(1200); inst.lookT=new T.Vector3(-.36,1.1,-2); return alive(); }
  const id=c.c.id, key=skey(id), part=g.parts[id]||g.parts[key];
  if(!part){ await sleep(500); applyAuto3d(t,key); return alive(); }
  const at=part.at;
  inst.lookT=at();
  // a pure visual check: lean in and read it, hands stay where they are
  if(t.k==='chk' && LOOK_ONLY.has(id) && who!=='inst'){
    camLean(at(), id==='ann'||id==='radio'||id==='cb'?.36:.26);
    if(id==='ann'&&/TEST/.test(c.it.text)) s.annTest=performance.now()+1600;
    await sleep(1700); if(!alive()) return false;
    camInside(); await sleep(450); inst.lookT=new T.Vector3(-.36,1.1,-2); return alive();
  }
  const person=who==='inst'?inst:g.people.me;
  const p0=at(), side=id==='stick'?1:who==='inst'?(p0.x<-.3?-1:1):(p0.x<.3?-1:1), A=person.arms[side], pose=poseFor(id);
  const roll=id==='stick'?(side>0?-Math.PI/2:Math.PI/2):0;
  const ap=id==='stick'?new T.Vector3(0,-.15,-1):['thr','prop','mix','flaps','trim','levers'].includes(id)?new T.Vector3(side*-.15,-.75,-1):null;
  if(who!=='inst'){ const e=new T.Vector3(...EYE.me); camLean(p0, Math.max(.32,e.distanceTo(p0)*.7), 50); }
  A.goal=()=>({p:at(), pose, roll, ap});
  await sleep(800); if(!alive()) return false;
  const press=async(ms=220)=>{ A.press=1; await sleep(ms); A.press=0; };
  const twist=async(dir=1)=>{ A.twist=.55*dir; await sleep(220); A.twist=0; };
  switch(t.k){
    case 'st':
      if(PINCH.has(id)){ await twist(); setState(key,t.v); }
      else if(GRIP.has(id)){ await press(120); setState(key,t.v); await sleep(key==='canopy'?900:key==='gear'?700:450); }
      else { await press(); setState(key,t.v); }
      break;
    case 'swap': { await twist(); const st=MECH[key].st; setState(key, st[(st.indexOf(s.st[key])+1)%st.length]); break; }
    case 'chk': if(id==='ann'||/TEST/.test(c.it.text)) s.annTest=performance.now()+1600; await press(650); break;
    case 'lev': case 'rpm': case 'map': {
      const to=t.k==='lev'?t.v:t.k==='map'?MAPT(t.v):s.st.air?MAPT(25):(t.v-750)/1950;
      fx('click'); await tween(key,to,1100);
      if(s.st.air && s.st.gear==='UP' && key==='thr' && s.st.thr<.05) fx('horn',1.6);
      break;
    }
    case 'cycle':
      if(key==='prop'){ await tween(key,0,850); await sleep(150); await tween(key,1,850); }
      else if(key==='trim'){ await tween('trim',-2,550); await tween('trim',2,650); await tween('trim',0,550); }
      else { await press(120); setState(key,'OUT'); await sleep(1400); await press(120); setState(key,'IN'); }
      break;
    case 'trimd': await tween('trim', s.st.trim+t.v, 750); break;
    case 'pull': case 'push': case 'hold': case 'side': case 'stir': await stick3d(t, c.it.text); break;
    default: await press(600);
  }
  if(!alive()) return false;
  if(key==='key' && s.cl.id==='engine' && /מצתים/.test(c.it.text)){
    A.goal=null; const B=inst.arms[1]; B.goal=()=>({p:at(), pose:'pinch'});
    checkerSay('לקחתי. בודק מצתים.', 'neutral'); await sleep(700);
    s.dip=100; setState('key','R'); await sleep(1100); setState('key','BOTH'); s.dip=0; await sleep(500); s.dip=120; setState('key','L'); await sleep(1100); setState('key','BOTH'); s.dip=0;
    B.goal=null; if(!alive()) return false; checkerSay('מצתים תקינים. החזרתי לך.', 'ok');
  }
  await sleep(220); if(!alive()) return false;
  A.goal=null; camInside(); inst.lookT=new T.Vector3(-.36,1.1,-2);
  await sleep(500);
  return alive();
}

function applyAuto3d(t,key){ if(t.k==='st') setState(key,t.v); else if(t.k==='lev') SIM.st[key]=t.v; else if(t.k==='map') SIM.st.thr=MAPT(t.v); else if(t.k==='rpm') SIM.st.thr=SIM.st.air?MAPT(25):(t.v-750)/1950; }
// Stick actions move the stick and the horizon: nose up/down, bank, hold.
async function stick3d(t, text){
  const g=G3, f=g.flight, sp=g.stickPose;
  const pitchFor=/נסיקה/.test(text)?8:/גלישה/.test(text)?-4:/הנמכה/.test(text)?-6:/אופקית/.test(text)?0:f.tPitch;
  if(t.k==='pull'){ sp.tx=.22; f.tPitch=pitchFor; }

function simFeedback(msg){ const el=document.getElementById('g3fb'); if(!el) return; el.textContent=msg; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

  const host=document.getElementById('g3c'); host.appendChild(G3.renderer.domElement);
  const resize=()=>{ const w=host.clientWidth, h=host.clientHeight; if(!w||!h) return; G3.renderer.setSize(w,h,false); G3.camera.aspect=w/h; G3.camera.updateProjectionMatrix(); };
  resize(); G3.resize=resize;

  document.getElementById('g3snd').onclick=e=>{ auMute(!AU.on); S.simSound=AU.on; save(); e.currentTarget.textContent=AU.on?'🔊 צליל':'🔇 צליל'; };

  if(s.done) showResult3D();

  if(!g3RAF){ g3Last=performance.now(); g3RAF=requestAnimationFrame(loop3D); }

function g3Lost(){

  const s=SIM, card=document.getElementById('g3card'); if(!s||!card) return;

  card.dataset.k='lost';
  card.innerHTML=`<div class="eyebrow">התצוגה נעצרה</div><div class="g3-q">הטלפון עצר את התלת-ממד – כנראה עומס על הזיכרון הגרפי.</div>
    <div class="mute" style="font-size:13px">סגור אפליקציות ולשוניות אחרות ונסה שוב. הבד״ח הזה יתחיל מההתחלה.</div>
    <div class="g3-opts row2"><button id="r3retry">נסה שוב</button><button id="r3exit">יציאה</button></div>`;

  document.getElementById('r3retry').onclick=()=>{ simStart(s.cl); simLaunch(); };

function exit3D(){ SIM=null; auSet(0,false); try{ speechSynthesis.cancel(); }catch(e){} document.body.style.overflow=''; renderSim(); }
function bindLook(el){
  if(el._look) return; el._look=true; let drag=null;
  el.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',e=>{ if(!drag||!G3) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY}; const c=G3.cam;
    if(c.mode==='in'){ c.lean=null; c.tYaw=Math.max(-2.2,Math.min(2.2,c.tYaw+dx*.005)); c.tPitch=Math.max(-1.2,Math.min(.6,c.tPitch+dy*.005)); c.tFov=Math.max(c.tFov,55); }
    else { c.tAz-=dx*.006; c.tEl=Math.max(.02,Math.min(1.2,c.tEl+dy*.004)); } });
  const end=()=>{ drag=null; }; el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{ if(!G3) return; e.preventDefault(); const c=G3.cam; if(c.mode==='in') c.tFov=Math.max(28,Math.min(80,c.tFov+e.deltaY*.03)); else c.tR=Math.max(3,Math.min(16,c.tR+e.deltaY*.01)); },{passive:false});
}
function simUpdate3D(){
  const s=SIM; if(!s||s.lost||!document.getElementById('g3')) return;
  const c=simCur(), st=s.st;
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('sPos',`${Math.min(s.k+1,s.steps.length)}/${s.steps.length}`); set('sMiss',s.miss);
  set('hFL',st.flaps); set('hTR',st.trim===0?'T/O':(st.trim>0?'+':'')+st.trim); set('hGR',Date.now()-s.gearT<2200?'···':st.gear);
  const card=document.getElementById('g3card'); if(!card || s.done) return;
  if(c && !c.auto && s.opts.length && !s.busy){
    if(card.dataset.k===String(s.k)){
      // same step after a wrong pick: mark it in place so its shake stays visible
      card.querySelector('.g3-q').textContent=s.stepMiss?'לא נכון. נסה שוב – מה עושים עכשיו?':'מה עושים עכשיו?';
      card.querySelectorAll('[data-o]').forEach(b=>{ const w=s.wrong.includes(+b.dataset.o); b.classList.toggle('wrong',w); b.disabled=w; });
    } else {
      card.dataset.k=String(s.k);
      card.innerHTML=`<div class="eyebrow">סעיף ${c.it.n}${c.it.head?' · '+F(c.it.head):''}</div>
        <div class="g3-q">${s.stepMiss?'לא נכון. נסה שוב – מה עושים עכשיו?':'מה עושים עכשיו?'}</div>
        <div class="g3-opts">${s.opts.map((o,i)=>`<button data-o="${i}" class="${s.wrong.includes(i)?'wrong':''}" ${s.wrong.includes(i)?'disabled':''}><span class="mono">${i+1}</span>${F(o.t)}</button>`).join('')}</div>`;
      card.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>simPick(+b.dataset.o));
      card.classList.add('show');
    }
  } else if(s.trWait){
    if(card.dataset.k!=='wait'){ card.dataset.k='wait';
      card.innerHTML=`<div class="eyebrow">המטוס טס – עוקבים אחרי המחוונים</div><div class="g3-q">מחכים: ${escS(s.trWait.txt)}…</div><div class="mute" style="font-size:13px">הסעיף הבא יופיע ברגע הנכון.</div>`; }
    card.classList.add('show');
  } else { card.classList.remove('show'); card.dataset.k=''; }
}
function showResult3D(){
  const s=SIM, card=document.getElementById('g3card'); if(!card) return;
  const mm=`${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,'0')}`;
  card.dataset.k='done';
  card.innerHTML=`<div class="eyebrow">${escS(s.cl.t)} · ${s.mode==='check'?'בוחן':'אימון'}</div><div class="g3-score mono">${s.acc}%</div>
    <div class="mute" style="font-size:14px">${s.clean}/${s.total} בלי טעות · ${s.miss} טעויות · ${mm}${S.simBest[s.cl.id]?` · שיא ${S.simBest[s.cl.id].acc}%`:''}</div>
    ${s.trEnd?trEndHTML(s):''}
    ${s.bad.length?`<div class="g3-bad">${s.bad.map(it=>`<div>${it.n}. ${F(it.text)}</div>`).join('')}</div>`:''}
    <div class="g3-opts row2"><button id="r3again">שוב</button>${s.mode==='train'?'<button id="r3check">עכשיו בבוחן</button>':''}<button id="r3exit">יציאה</button></div>`;
  card.classList.add('show');
  document.getElementById('r3again').onclick=()=>{ simStart(s.cl); simLaunch(); };

let g3RAF=0, g3Last=0, g3Au=0;
// Where a transition ended: speed, altitude, climb rate, and how far from the levelling altitude.
function trEndHTML(s){
  const e=s.trEnd, tgt=TR_START[s.cl.id].tgt, n=x=>Math.round(x).toLocaleString('en-US');
  const dev=tgt!=null?Math.round(e.alt-tgt):null, ok=dev==null||Math.abs(dev)<=50;
  return `<div class="mute" style="font-size:14px;margin-top:6px" dir="rtl">בסיום: <bdi dir="ltr" class="mono">${n(e.v)} kt · ${n(e.alt)} ft · ${e.vs>=0?'+':''}${n(Math.round(e.vs/10)*10)} fpm</bdi>${dev!=null?` · סטייה מ-<bdi dir="ltr">${n(tgt)}</bdi>: <b class="mono" style="color:${ok?'var(--ok,#1f9a3a)':'var(--arc-red)'}"><bdi dir="ltr">${dev>0?'+':''}${dev}</bdi> רגל</b>`:''}</div>`;
}
// Transitions: speed, climb rate and altitude follow throttle (MAP), pitch and flaps; gates open when reached.
function trStep(s, f, dt, map){
  const tf=s.trf, d=dt*tf.fast;
  tf.mp+=(map-tf.mp)*Math.min(1,d*2); tf.pitch=f.pitch; tf.flaps+=((s.st.flaps!=='UP'?1:0)-tf.flaps)*Math.min(1,d*.8);
  tf.v+=(trVeq(tf)-tf.v)*(1-Math.exp(-d/10)); tf.vs+=(trVs(tf)-tf.vs)*(1-Math.exp(-d/1.2)); tf.alt+=tf.vs/60*d;
  if(s.st.thr<.02 && s.st.gear==='UP' && !tf.hornDone){ tf.hornDone=true; tf.horn=3; }   // gear-up warning at idle
  if(s.st.thr>.05) tf.hornDone=false;
  if(tf.horn>0) tf.horn-=dt;
  if(s.trWait && s.trWait.done()){ s.trWait=null; tf.fast=1; s.busy=false; checkerSay('עכשיו!', 'neutral'); simBegin(); }
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('hKT',Math.round(tf.v)); set('hALT',Math.round(tf.alt).toLocaleString('en-US')); set('hVS',(tf.vs>=0?'+':'')+Math.round(tf.vs/10)*10);
  const hn=document.getElementById('hHorn'); if(hn) hn.hidden=!(tf.horn>0);
}
function loop3D(now){
  const s=SIM, el=document.getElementById('g3');
  if(!s||!el||tab!=='sim'||!G3){ g3RAF=0; auSet(0,false); document.body.style.overflow=''; return; }
  g3RAF=requestAnimationFrame(loop3D);   // schedule first, so one failed frame (e.g. a lost WebGL context) can't freeze the sim
  const dt=Math.min(.05,(now-g3Last)/1000); g3Last=now; const t=now/1000;
  const dip=s.dip+(s.st.altair==='OUT'&&s.st.run?50:0);
  const target=Math.max(0,engRPM(s.st)-dip); s.rpmS+=(target-s.rpmS)*(target<s.rpmS?.08:.035);
  const rpm=Math.round(s.rpmS), map=engMAP(s.st);
  const hr=document.getElementById('hRPM'); if(hr){ hr.textContent=rpm.toLocaleString('en-US'); document.getElementById('hMAP').textContent=s.st.run?map.toFixed(1):'–'; }
  // world: airborne lists fly, ground lists sit on the apron
  const g=G3, f=g.flight;
  g.ground.visible=!s.st.air; g.airWorld.visible=s.st.air;
  f.pitch+=(f.tPitch-f.pitch)*Math.min(1,dt*1.2); f.bank+=(f.tBank-f.bank)*Math.min(1,dt*1.2);
  if(s.trf) trStep(s, f, dt, map);
  if(s.st.air){ f.head+=f.bank*.0009; g.fields.material.map.offset.y+=dt*.004; }
  g.env.rotation.set(-f.pitch*Math.PI/180, f.head, f.bank*Math.PI/180, 'YXZ');
  g.scene.fog=s.st.air?(g.fogAir||(g.fogAir=new THREE.Fog('#c9dcec',600,5200))):null;
  apply3D(s.st, dt, t);
  personUpdate(g.people.me,dt,now); personUpdate(g.people.inst,dt,now);
  // cockpit vibration with the engine
  camUpdate(dt);
  const a=RM?0:rpm?(.0006+rpm/2700*.0016):0; if(a){ g.camera.position.x+=Math.sin(t*61)*a; g.camera.position.y+=Math.cos(t*47)*a; }
  g.renderer.render(g.scene, g.camera);
  if(++g3Au%5===0) auSet(rpm, s.st.air);
}
addEventListener('resize',()=>{ if(G3&&G3.resize) G3.resize(); });
// Starting a run in 3D: flyaround outside, then into the trainee's seat.
function start3DRun(){
  const g=G3, s=SIM; if(!g||!s) return;
  const air=s.st.air, cl=s.cl.id, f=g.flight;
  const P0={tr2:8,tr4:-4,tr6:-6,departure:8}, B0={};
  f.pitch=f.tPitch=air?(P0[cl]||0):0; f.bank=f.tBank=air?(B0[cl]||0):0; f.head=0;
  g.stickPose.tx=g.stickPose.tz=0;
  const c=g.cam;
  if(cl==='external'||cl==='safety'){ c.mode='out'; c.az=c.tAz=.9; c.el=c.tEl=.22; c.r=c.tR=9; c.target.set(0,.8,1.2); c.snap=true; }
  else if(RM){ camInside(); c.yaw=0; c.pitch=-.38; c.snap=true; c.mode='in'; }
  else { c.mode='out'; c.az=-.6; c.el=.3; c.r=11; c.target.set(0,.8,1.2); c.tAz=1.4; c.tEl=.18; c.tR=8; c.snap=true; setTimeout(()=>{ if(SIM===s) camInside(); }, 2600); }
  for(const P of [g.people.me,g.people.inst]){ P.lookT=new THREE.Vector3(P.x,1.1,-2); for(const sd of [-1,1]){ P.arms[sd].goal=null; P.arms[sd].init=false; } }
}

// ---------- Keyboard ----------
document.addEventListener('keydown',e=>{
  if(TR3){ if(e.key==='Escape') trClose(); else if('1234'.includes(e.key) && e.key.length===1) trPick(+e.key-1);
    else if(TR3.mode==='area' && TR3.answered && !TR3.done && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); trAreaNext(); } return; }
  if(e.key==='Escape' && !sheet.hidden){ closeSheet(); return; }
  if(!sheet.hidden || ['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key;
  if(tab==='cards' && cur){
    if(!shown && (k===' '||k==='Enter')){ e.preventDefault(); reveal(); }
    else if(shown && '1234'.includes(k) && k.length===1) doGrade(+k, V.querySelector(`[data-gr="${k}"]`));
  } else if(tab==='recite' && R && R.idx<R.cl.items.length){
    if(!R.shown && k===' '){ e.preventDefault(); R.shown=true; renderRecite(); }
    else if(R.shown && (k==='1'||k==='2')) reciteMark(k==='2');
  } else if(tab==='quiz' && TS.qs && TS.i<TS.qs.length){
    const q=TS.qs[TS.i];
    if(TS.picked==null && '1234'.includes(k) && k.length===1) testPick(+k-1);
    else if(TS.phase==='which' && 'אבגד'.includes(k) && k.length===1) testWhich('אבגד'.indexOf(k));
    else if(TS.picked!=null && (TS.mode!=='mix'||TS.phase==='next') && (k===' '||k==='Enter')){ e.preventDefault(); testNext(); }
  } else if(tab==='quiz' && TS.mode==='num' && QZ && QZ.i<QZ.qs.length){
    if(QZ.picked==null && '1234'.includes(k) && k.length===1) quizPick(+k-1);
    else if(QZ.picked!=null && (k===' '||k==='Enter')){ e.preventDefault(); quizNext(); }
  } else if(tab==='sim' && SIM && SIM.started && !SIM.busy && '1234'.includes(k) && k.length===1){
    simPick(+k-1);
  }
});
