<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a1017"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://hbnzpfhjxocsnukpnbui.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style></head><body><title>בד״ח סנונית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<style>
/* Layout: a night cockpit. Content sits in bezel-framed instrument panels; home opens on a dawn-sky window. */
:root{
  color-scheme:dark;
  --bg:#0a1017; --panel:#111a24; --panel-2:#16212d; --bezel:#24333f; --line:#2b3b4c;
  --ink:#e9eff5; --mute:#93a4b5; --dim:#5f7182;
  --sky:#6cb8ff; --amber:#ffb84d;
  --arc-white:#eef2f6; --arc-green:#3dd283; --arc-yellow:#f4c542; --arc-red:#ff5d50;
  --sq:#c9a6ff; --ins:#8796a6;
  --ai-sky:#3b82d6; --ai-ground:#8a5a2b;
  --f-display:'Secular One','Heebo',system-ui,sans-serif;
  --f-body:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html{direction:rtl}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  background-image:radial-gradient(1200px 500px at 80% -10%,#15263a 0%,transparent 60%),radial-gradient(900px 400px at 0% 110%,#121f2c 0%,transparent 60%);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--amber);font-weight:700}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .plane{width:54px;flex:none}
.brand h1{font-size:24px;line-height:1}
.brand small{display:block;font-size:12px;color:var(--mute)}
.ai{width:44px;height:44px;flex:none}
.ai-h{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.ai-wob{animation:wob 6s ease-in-out infinite;transform-origin:20px 20px}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip b{color:var(--ink);font-family:var(--f-mono)}
.chip.streak b{color:var(--amber)}

/* Nav */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;color:var(--mute);font-size:14px;font-weight:500;transition:background .2s,color .2s,border-color .2s}
nav.tabs button.on{background:var(--sky);color:#06121f;border-color:var(--sky);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:14px}
.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.filters label{display:flex;align-items:center;gap:6px}

/* Panels */
.panel{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px -18px rgba(0,0,0,.8)}
.panel.rivets::before,.panel.rivets::after{content:"";position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4a5d70,#1a2633)}
.panel.rivets::before{right:8px}.panel.rivets::after{left:8px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-title h2{font-size:20px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{border-color:var(--sky)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#06121f;font-weight:700}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1c1204;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%;padding:14px;font-size:16px}
.stars{color:var(--amber);font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sq{color:var(--sq)} .ins{color:var(--ins);font-style:italic}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:20px;min-height:250px;margin-bottom:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,#0b1a33 0%,#183a6e 42%,#5b5f8f 66%,#e0875a 86%,#f6b36a 100%)}
.hero .sun{position:absolute;left:18%;bottom:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffe2a8 0%,#ffb46a 35%,rgba(255,150,90,0) 70%)}
.cloud{position:absolute;height:40px;border-radius:50%;filter:blur(6px);opacity:.55;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0));animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-60vw)}to{transform:translateX(120vw)}}
.hero .fly{position:absolute;left:12%;top:26%;width:min(46%,260px);animation:bob 4.5s ease-in-out infinite}
.hero .fly::after{content:"";position:absolute;top:52%;left:96%;width:260%;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(-4deg)}}
.hero .txt{position:relative;z-index:2;padding:22px 22px 70px;max-width:60%;margin-inline-start:0}
.hero h2{font-size:30px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero p{color:#dbe7f5;margin:8px 0 14px;font-size:15px}
.runway{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:clamp(8px,3vw,22px);z-index:1}
.runway i{width:6px;height:6px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px #ffd56a;opacity:.25;animation:rabbit 1.6s infinite}
@keyframes rabbit{0%,70%,100%{opacity:.2}10%{opacity:1}}
/* Symbol parts are styled without ancestor selectors: <use> instances only see rules matching the symbol itself. */
.pl-body{fill:#f4f6f8}.pl-stripe{fill:#e2552f}.pl-glass{fill:#7cc4ff;opacity:.9}
.pl-wing{fill:#d9dee4}.pl-spin{fill:#e2552f}.pl-prop rect{fill:#2a2f36}
.pl-prop{transform-origin:14.5px 37px;animation:prop .12s linear infinite}
.pl-disc{fill:rgba(220,230,240,.18)}
@keyframes prop{0%{transform:scaleY(1)}50%{transform:scaleY(.1)}100%{transform:scaleY(1)}}
@media (max-width:560px){.hero .txt{max-width:100%;padding-bottom:110px}.hero .fly{top:auto;bottom:34px;left:6%;width:52%}.hero h2{font-size:26px}}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1}
.tile .l{font-size:12px;color:var(--mute)}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.ready{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center}
@media (max-width:560px){.ready{grid-template-columns:1fr;justify-items:center;text-align:center}}
.dial-needle{transition:transform 1.4s cubic-bezier(.25,1.2,.4,1);transform-origin:100px 100px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.bars .b i{display:block;width:100%;border-radius:4px 4px 1px 1px;background:var(--sky);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bars .b i.ok{background:var(--arc-green)}
.bars .b span{font-size:10px;color:var(--dim);font-family:var(--f-mono)}
@keyframes grow{from{transform:scaleY(0)}}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;font-size:14px;background:none;border:0;text-align:right;padding:4px 0;color:inherit}
.mrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--arc-green),#7ff0b3);transform-origin:right;animation:fill 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.weak{display:grid;gap:8px}
.weak div{display:flex;gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.weak b{color:var(--arc-red);font-family:var(--f-mono);min-width:26px}

/* Flashcards */
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;padding:26px 18px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.fc .ctx{font-size:13px;color:var(--mute)}
.fc .q{font-size:23px;font-weight:700;line-height:1.45}
.fc .prev{font-size:15px;color:var(--mute);font-weight:400;margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px dashed var(--line)}
.fc .a{font-size:22px;color:var(--arc-green);border-top:1px dashed var(--line);padding-top:14px;animation:reveal .35s ease-out}
.fc .x{font-size:14px;color:var(--mute)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}}
.terms{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.term{font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;color:var(--sky)}
.term::before{content:"? ";color:var(--amber);font-weight:700}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-weight:700}
.grades .kbd{display:block;font-size:11px;color:var(--dim);font-weight:400;font-family:var(--f-mono)}
.g1{color:var(--arc-red);border-color:color-mix(in srgb,var(--arc-red) 50%,var(--line))!important}
.g2{color:var(--arc-yellow)}
.g3{color:var(--arc-green)}
.g4{color:var(--arc-white)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* Recite */
.strip{position:relative;height:34px;border-radius:8px;background:#1b232c;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.strip::before{content:"";position:absolute;inset:50% 12px auto;border-top:2px dashed rgba(255,255,255,.35)}
.strip .pl{position:absolute;top:2px;width:56px;transition:inset-inline-start .6s cubic-bezier(.3,.7,.2,1)}
ol.steps{list-style:none;margin:10px 0 0;padding:0}
ol.steps li{display:flex;gap:10px;padding:8px 6px;border-top:1px solid var(--line);align-items:baseline}
ol.steps li .n{min-width:44px;color:var(--dim);font-family:var(--f-mono);font-size:13px}
ol.steps li.head{font-weight:700;color:var(--amber);border-top:0;padding-top:14px}
ol.steps li.note{font-size:14px;color:var(--mute);font-style:italic}
ol.steps li.grey{opacity:.45;text-decoration:line-through}
ol.steps li.cur{background:rgba(108,184,255,.1);border-radius:8px;box-shadow:inset 3px 0 0 var(--sky)}
ol.steps .hid{color:var(--dim);letter-spacing:.3em}
ol.steps .mark{margin-inline-start:auto;font-weight:700}
.ok{color:var(--arc-green)} .bad{color:var(--arc-red)}
.dock{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,rgba(10,16,23,0));padding:16px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}

/* Quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:right;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:16px;transition:border-color .2s,background .2s}
.opts button.right{border-color:var(--arc-green);background:rgba(61,210,131,.12);color:var(--arc-green);font-weight:700}
.opts button.wrong{border-color:var(--arc-red);background:rgba(255,93,80,.1);color:var(--arc-red)}
.opts button:disabled{cursor:default}

/* Dictionary */
.search{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.search input{flex:1;min-width:0;background:none;border:0;padding:10px 0;font-size:17px;outline:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cats button{flex:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;color:var(--mute)}
.cats button.on{border-color:var(--amber);color:var(--amber)}
.gl{display:grid;gap:10px}
.ge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;animation:cardIn .3s both}
.ge h3{font-size:19px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ge .en{font-family:var(--f-mono);font-size:12px;color:var(--sky)}
.ge p{margin:6px 0 8px;font-size:15px}
.ge .verify{font-size:12px;color:var(--arc-yellow)}
.ge .refs{display:flex;flex-wrap:wrap;gap:6px}
.ge .refs button{font-size:12px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 8px;color:var(--mute)}
mark{background:rgba(255,184,77,.25);color:inherit;border-radius:3px}

/* Read */
details.cl{padding:0}
details.cl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px}
details.cl summary::-webkit-details-marker{display:none}
details.cl summary .t{flex:1;font-weight:700;min-width:0}
details.cl summary::after{content:"‹";color:var(--dim);transition:transform .2s}
details.cl[open] summary::after{transform:rotate(-90deg)}
details.cl .body{padding:0 16px 16px}
.mini{width:60px;height:6px}

/* Simulator */
.sim-hud{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
@media (max-width:520px){.sim-hud{grid-template-columns:84px 1fr}}
.tach-needle{transition:transform .9s cubic-bezier(.3,1.4,.4,1);transform-origin:60px 60px}
.sim-q{font-size:19px;font-weight:700;line-height:1.4}
.sim-q.auto{color:var(--ins);font-style:italic;font-weight:500}
.sim-opts{display:grid;gap:8px;margin-top:10px}
.sim-opts button{text-align:right;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.sim-opts button.wrong{border-color:var(--arc-red);color:var(--arc-red);opacity:.7}
.cockpit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:620px){.cockpit{grid-template-columns:1fr}}
.cockpit.dimmed .zone{opacity:.45;pointer-events:none}
.zone{background:#0d151e;border:1px solid var(--bezel);border-radius:14px;padding:10px 10px 12px;transition:opacity .3s}
.zone.wide{grid-column:1/-1}
.zone .zt{font-size:11px;letter-spacing:.1em;color:var(--amber);font-weight:700;margin-bottom:8px}
.zone .cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.025);font-size:12px;line-height:1.25;color:var(--ink);text-align:center;transition:background .2s,border-color .2s}
.ctl:hover{border-color:var(--line)}
.ctl.wrong{animation:shake .4s;border-color:var(--arc-red)}
.ctl.hint{border-color:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,184,77,.25)}}
.ctl.on{background:rgba(61,210,131,.08)}
.vis{width:34px;height:34px;position:relative;display:block}
.v-sw .vis::before{content:"";position:absolute;inset:4px 11px;border-radius:6px;background:#1d2732;border:1px solid #3a4a5b}
.v-sw .vis::after{content:"";position:absolute;left:14px;width:6px;height:15px;top:15px;border-radius:3px;background:linear-gradient(#e5ebf1,#9aa7b4);transition:top .25s cubic-bezier(.3,1.5,.5,1)}
.v-sw.on .vis::after{top:4px}
.v-lever .vis::before{content:"";position:absolute;inset:2px 15px;border-radius:2px;background:#26313c}
.v-lever .vis::after{content:"";position:absolute;left:7px;width:20px;height:12px;top:20px;border-radius:6px;background:var(--knob,#222);border:1px solid rgba(255,255,255,.25);transition:top .35s cubic-bezier(.3,1.4,.5,1)}
.v-lever.on .vis::after{top:2px}
.v-knob .vis::before{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4c5b6a,#18222c);border:1px solid #3a4a5b}
.v-knob .vis::after{content:"";position:absolute;left:16px;top:5px;width:2px;height:12px;background:var(--amber);transform-origin:1px 12px;transition:transform .35s}
.v-knob.on .vis::after{transform:rotate(90deg)}
.v-gauge .vis::before{content:"";position:absolute;inset:2px;border-radius:50%;background:#05090d;border:2px solid #3a4a5b}
.v-gauge .vis::after{content:"";position:absolute;left:16px;top:6px;width:2px;height:11px;background:var(--arc-white);transform-origin:1px 11px;transform:rotate(-120deg);transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.v-gauge.on .vis::after{transform:rotate(30deg);background:var(--arc-green)}
.v-btn .vis::before{content:"";position:absolute;inset:6px;border-radius:6px;background:#1d2732;border:1px solid #3a4a5b;transition:background .2s,box-shadow .2s}
.v-btn.on .vis::before{background:var(--amber);box-shadow:0 0 12px rgba(255,184,77,.6)}
.pv{transition:opacity .3s}
.pv.dimmed{opacity:.55;pointer-events:none}
.photo-wrap{overflow:auto;max-height:72vh;border-radius:14px;border:1px solid var(--bezel);background:#000;overscroll-behavior:contain}
.photo{position:relative}
.photo img{display:block;width:100%;height:auto}
.hs{position:absolute;padding:0;border:2px solid transparent;border-radius:8px;background:transparent;transition:border-color .2s,background .2s}
.hs:hover,.hs:focus-visible{border-color:rgba(108,184,255,.85);background:rgba(108,184,255,.12)}
.hs.on{border-color:rgba(61,210,131,.9);background:rgba(61,210,131,.18)}
.hs.wrong{border-color:var(--arc-red);background:rgba(255,93,80,.22);animation:shake .4s}
.hs.hint{border-color:var(--amber);animation:pulse 1s ease-in-out infinite}
.btn.sm{padding:4px 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--sky);color:#06121f;font-weight:700}
.simlog{display:grid;gap:4px;margin-top:10px;font-size:13px}
.simlog div{color:var(--mute);animation:reveal .3s}
.simlog div b{color:var(--arc-green)}

/* Sheet + toast + flyby */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(3,7,12,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet>div{width:min(560px,100%);max-height:80vh;overflow:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:18px;animation:up .3s cubic-bezier(.2,.8,.2,1)}

  const key=clean(it.q||it.text); let best=null, bl=0;

// ---------- Parsing & text rendering: #…# = squadron procedure, {…} = done by instructor ----------
function parseItem(raw){
  const f=raw.split('|');
  const it={n:f[0], text:f[1]||'', kind:'step'};
  if(it.n==='') it.kind='head';
  else if(it.n==='!') it.kind='note';
  else if(it.n[0]==='~'){ it.kind='grey'; it.n=it.n.slice(1); }
  it.instr=/^\{.*\}$/.test(it.text);
  if(f.length>2){ it.q=it.text; it.a=f[2]; it.x=f[3]||''; }
  else { const k=it.text.indexOf('–'); if(k>0){ it.q=it.text.slice(0,k).trim(); it.a=it.text.slice(k+1).trim(); } }
  return it;
}
for(const cl of D){
  cl.items=(cl.items||[]).map(parseItem);
  let head='';
  cl.items.forEach((it,i)=>{ it.i=i; it.cl=cl; if(it.kind==='head') head=it.text; else it.head=head; });
}

function fmt(s, st={sq:false,ins:false}){
  st={...st}; let h=(st.ins?'<span class="ins">':'')+(st.sq?'<span class="sq">':'');
  for(const ch of s){
    if(ch==='#'){ h+=st.sq?'</span>':'<span class="sq">'; st.sq=!st.sq; }
    else if(ch==='{'){ if(!st.ins){ h+='<span class="ins">'; st.ins=true; } }
    else if(ch==='}'){ if(st.ins){ h+='</span>'; st.ins=false; } }
    else h+=esc(ch);
  }
  h+=(st.sq?'</span>':'')+(st.ins?'</span>':'');
  return [h, st];
}

  catch(e){ dirty=true; setSync('לא נשמר בחשבון · נשמר במכשיר'); }

}
async function initCloud(){
  if(!window.claude || !window.claude.use){ setSync('נשמר במכשיר הזה'); return; }
  const [db, user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const id=user ? await user.id() : null;
  if(!db || !id){ setSync('נשמר במכשיר הזה בלבד'); return; }
  const ref=db.doc('data/users/'+id+'/progress-v2');
  try{
    const snap=await ref.get();
    if(snap.exists){ mergeState(JSON.parse(snap.data().state||'{}')); render(); }
    cloud={save:()=>ref.set({v:1, state:JSON.stringify(S)})}; setSync('✓ נשמר בחשבון');

  }catch(e){ setSync('נשמר במכשיר הזה בלבד'); }
}

const dayTotals=k=>{ const d=S.log[k]||{}; let n=0,o=0; for(const v of Object.values(d)){ n+=v[0]; o+=v[1]; } return [n,o]; };
function streak(){
  let n=0; const t=new Date(); t.setHours(12);
  if(!dayTotals(dk(t))[0]) t.setDate(t.getDate()-1);
  while(dayTotals(dk(t))[0]){ n++; t.setDate(t.getDate()-1); }
  return n;
}

    if(it.kind!=='step' || (it.instr && !instr)) return;
    if(!cl.data) out.push({id:`${cl.id}:${i}:n`, cl, it, i, type:'n'});
    if(it.a) out.push({id:`${cl.id}:${i}:r`, cl, it, type:'r'});
  });
  return out;
}
const allCards=()=>visible().flatMap(cl=>cardsOf(cl));
const MIN=60e3, DAY=864e5;
function grade(c,g){
  const now=Date.now(); let p=S.p[c.id];
  if(!p){ p={s:'new', i:0, e:2.5, d:now, l:0}; newToday(); S.newCount++; }
  if(g===1){ p.s='learn'; p.l++; p.e=Math.max(1.3,p.e-.2); p.i=0; p.d=now+MIN; }
  else if(p.s!=='review'){
    if(g===2){ p.s='learn'; p.d=now+5*MIN; }
    else if(g===3 && p.s==='new'){ p.s='learn'; p.d=now+10*MIN; }
    else { p.s='review'; p.i=g===4?3:1; p.d=now+p.i*DAY; }
  } else {
    if(g===2){ p.i=Math.max(1,p.i*1.2); p.e=Math.max(1.3,p.e-.15); }
    else if(g===3) p.i=p.i*p.e;
    else { p.i=p.i*p.e*1.3; p.e+=.15; }
    p.d=now+p.i*DAY;
  }
  S.p[c.id]=p; track(c.cl.id, c.it.i, g>=3); logEv('c', g>=3); save();
  return p;
}
function sendToReview(it){
  for(const c of cardsOf(it.cl, true)) if(c.it===it){ const p=S.p[c.id]||{s:'learn',i:0,e:2.5,l:0}; p.s='learn'; p.i=0; p.l=(p.l||0)+1; p.d=Date.now(); S.p[c.id]=p; }
}
function mastery(cl){
  const cs=cardsOf(cl); if(!cs.length) return null;
  return cs.filter(c=>S.p[c.id]&&S.p[c.id].s==='review').length/cs.length;
}

  const now=Date.now(), cs=allCards();
  if(ahead) return cs.filter(c=>S.p[c.id]).sort((a,b)=>S.p[a.id].d-S.p[b.id].d).slice(0,20);

  const left=Math.max(0, S.newLimit-newToday())+extraNew;
  return [...due, ...cs.filter(c=>!S.p[c.id]).slice(0,left)];

// ---------- Recite a whole checklist ----------
let R=null;

  const list=reciteList();
  if(!list.length){ V.innerHTML='<div class="panel mute">אין בד״חים ברמת הכוכביות שבחרת.</div>'; return; }
  if(!R || !list.includes(R.cl)) R={cl:list[0], idx:0, res:{}, shown:false};
  const cl=R.cl, skip=it=>it.kind!=='step' || (it.instr && !S.instr);
  while(R.idx<cl.items.length && skip(cl.items[R.idx])) R.idx++;
  const done=R.idx>=cl.items.length;
  const stepIdx=cl.items.filter(it=>!skip(it)), steps=stepIdx.length;
  const passed=stepIdx.filter(it=>it.i<R.idx).length, right=Object.values(R.res).filter(Boolean).length;
  const best=S.best[cl.id];
  const rows=cl.items.map((it,i)=>{
    const open=i<R.idx || (i===R.idx && R.shown) || done;
    const cls=[it.kind, i===R.idx&&!done?'cur':''].join(' ');
    const mark=R.res[i]===true?'<span class="mark ok">✓</span>':R.res[i]===false?'<span class="mark bad">✗</span>':'';
    const n=it.kind==='step'||it.kind==='grey'?it.n:'';
    const body=(open||it.kind==='head'||it.kind==='note'&&i<=R.idx)?F(it.text):'<span class="hid">• • •</span>';
    return `<li class="${cls}"><span class="n">${n}</span><span class="grow">${body}</span>${mark}</li>`;
  }).join('');
  const pct=steps?passed/steps:0;
  V.innerHTML=`<div class="row" style="margin-bottom:10px"><select id="rsel" class="grow" style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px">${list.map(c=>`<option value="${c.id}" ${c===cl?'selected':''}>${escS(c.t)} ${starTxt(c.s)}</option>`).join('')}</select>

function reciteMark(ok){
  const cl=R.cl, i=R.idx;
  R.res[i]=ok; track(cl.id, i, ok); logEv('r', ok); aiNudge(ok);
  if(!ok) sendToReview(cl.items[i]);
  R.idx++; R.shown=false;
  const rest=cl.items.slice(R.idx).some(it=>it.kind==='step' && !(it.instr && !S.instr));
  if(!rest){ const v=Object.values(R.res), pct=Math.round(100*v.filter(Boolean).length/v.length);
    S.best[cl.id]=Math.max(S.best[cl.id]||0, pct); Q=null; flyBy(true); }
  save(); render();
}

// ---------- Numbers quiz ----------
let QZ=null;
function newQuiz(){
  const pool=visible().filter(cl=>cl.data).flatMap(cl=>cl.items.filter(it=>it.kind==='step').map(it=>({cl,it})));
  const allA=[...new Set(D.filter(c=>c.data).flatMap(c=>c.items.map(it=>it.a)))];
  const unit=a=>a.replace(/[\d.,\-‎+ ]/g,'');
  return {i:0, score:0, picked:null, qs:shuffle(pool).slice(0,10).map(({cl,it})=>{
    const same=[...new Set(cl.items.map(x=>x.a))].filter(a=>a!==it.a);
    const other=shuffle(allA.filter(a=>a!==it.a && !same.includes(a) && unit(a)===unit(it.a)));
    return {cl, it, opts:shuffle([it.a, ...shuffle(same).concat(other).slice(0,3)])};
  })};
}
function renderNum(){
  if(!QZ) QZ=newQuiz();

    document.getElementById('qa').onclick=()=>{ QZ=null; render(); }; return;
  }
  const q=QZ.qs[QZ.i], [qh]=qa(q.it);
  V.innerHTML=`<div class="row" style="margin-bottom:8px">${QZ.qs.map((_,k)=>`<span style="flex:1;height:4px;border-radius:2px;background:${k<QZ.i?'var(--arc-green)':k===QZ.i?'var(--sky)':'var(--line)'}"></span>`).join('')}</div>
    <div class="panel rivets" id="qp"><div class="mute" style="font-size:13px">${QZ.i+1}/${QZ.qs.length} · ${escS(q.cl.t)} <span class="stars">${starTxt(q.cl.s)}</span> · עמ׳ ${q.cl.p}</div>
    <div style="font-size:21px;font-weight:700;margin-top:6px">${qh}</div>
    <div class="opts">${q.opts.map((o,k)=>{ let cls=''; if(QZ.picked!=null){ if(o===q.it.a) cls='right'; else if(k===QZ.picked) cls='wrong'; }
      return `<button class="${cls}" data-k="${k}" ${QZ.picked!=null?'disabled':''}><span class="mono dim">${k+1}</span>&nbsp; ${F(o)}</button>`; }).join('')}</div>
    ${QZ.picked!=null?`${q.it.x?`<p class="mute">${F(q.it.x)}</p>`:''}${termChips(q.it.q)}<button class="btn pri" id="qn" style="margin-top:12px">הבא (רווח)</button>`:''}</div>`;
  V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>quizPick(+b.dataset.k));

function quizPick(k){
  const q=QZ.qs[QZ.i]; if(QZ.picked!=null || !q.opts[k]) return;
  QZ.picked=k; const ok=q.opts[k]===q.it.a; if(ok) QZ.score++; track(q.cl.id, q.it.i, ok);
  logEv('q', ok); aiNudge(ok);
  if(QZ.i===QZ.qs.length-1) S.quizBest=Math.max(S.quizBest||0, QZ.score);
  save(); renderQuiz();
  const b=V.querySelector(`[data-k="${k}"]`); if(ok) pop('✓', b); else shake(document.getElementById('qp'));
}
function quizNext(){ QZ.i++; QZ.picked=null; if(QZ.i>=QZ.qs.length && QZ.score>=8) flyBy(true); renderQuiz(); }

// ---------- Per-checklist error tracking (feeds "hardest" lists, mine and everyone's) ----------
// S.tr[clId] = {n: answers, w: wrong answers, it: {itemIndex: wrongCount}}
function track(clId, i, ok){
  const tr=S.tr||(S.tr={}), t=tr[clId]||(tr[clId]={n:0,w:0,it:{}});
  t.n++; if(!ok){ t.w++; t.it[i]=(t.it[i]||0)+1; }
}
const coreTxt=t=>clean(String(t).replace(/#[^#]*#/g,'')).replace(/חנייה/g,'חניה').replace(/\s+/g,' ').trim();
// Up to 3 near-miss distractors for "which step comes here" (its = the checklist's steps in order).
function stepOpts(cl, its, i, withPrev=true){
  const right=its[i].text, seen=new Set([coreTxt(right)]), opts=[], c=ctrlFor(its[i]);
  const add=t=>{ if(t && !seen.has(coreTxt(t)) && opts.length<3){ seen.add(coreTxt(t)); opts.push(t); } };
  const mut=shuffle(mutate(right));
  add(mut[0]);                                                     // right control, wrong action
  add(its[i+1]&&its[i+1].text);                                    // skipped ahead
  if(c) add(shuffle(D.filter(x=>!x.data).flatMap(x=>x.items.filter(it=>it.kind==='step'&&ctrlFor(it)===c&&clean(it.text)!==clean(right)))).map(it=>it.text)[0]);
  add(mut[1]);
  if(withPrev) add(its[i-1]&&its[i-1].text);
  shuffle(cl.items.filter(it=>it.kind==='step')).forEach(it=>add(it.text));
  shuffle(D.filter(x=>!x.data).flatMap(x=>x.items.filter(it=>it.kind==='step'))).forEach(it=>add(it.text));
  return shuffle([{t:right,ok:true}, ...opts.map(t=>({t,ok:false}))]);
}
// Distractors for "what is the response / value of this item".
function respOpts(cl, it){
  const right=it.a, seen=new Set([coreTxt(right)]), opts=[];
  const add=t=>{ if(t && !seen.has(coreTxt(t)) && opts.length<3){ seen.add(coreTxt(t)); opts.push(t); } };
  const unit=a=>a.replace(/[\d.,\-‎+ ]/g,'');
  if(cl.data){
    shuffle(cl.items.filter(x=>x.a && x!==it)).forEach(x=>add(x.a));
    shuffle(D.filter(c=>c.data).flatMap(c=>c.items.filter(x=>x.a && unit(x.a)===unit(right)))).forEach(x=>add(x.a));
  }
  add(shuffle(mutate(right))[0]);
  shuffle(cl.items.filter(x=>x.a && x!==it)).forEach(x=>add(x.a));
  shuffle(D.flatMap(c=>c.items.filter(x=>x.a))).forEach(x=>add(x.a));
  return shuffle([{t:right,ok:true}, ...opts.map(t=>({t,ok:false}))]);
}

// ---------- Tests: mixed (and name the checklist to continue) / regular (one checklist) ----------
let TS={mode:'menu'};
const testable=()=>visible().filter(cl=>!cl.instrOnly && cl.items.some(it=>it.kind==='step'));
const stepsOf=cl=>cl.items.filter(it=>it.kind==='step' && !(it.instr && !S.instr));
function testPool(cl, mixed){
  const its=stepsOf(cl), out=[];
  its.forEach((it,k)=>{
    if(cl.data){ if(it.a) out.push({cl,it,type:'r'}); return; }
    if(k>0 || !mixed) out.push({cl,it,type:'n',k,its});
    if(it.a) out.push({cl,it,type:'r'});
  });
  return out;
}
// Checklists that contain the same question, so naming any of them counts.
function sameIn(q, cl){
  if(q.type==='r') return cl.items.some(x=>x.kind==='step' && coreTxt(x.q||'')===coreTxt(q.it.q||'') && coreTxt(x.a||'')===coreTxt(q.it.a||''));
  const its=stepsOf(cl), prev=q.its[q.k-1];
  return its.some((x,k)=>k>0 && coreTxt(x.text)===coreTxt(q.it.text) && coreTxt(its[k-1].text)===coreTxt(prev.text));
}
function buildTest(mode, ids, n){
  const cls=ids.map(id=>D.find(c=>c.id===id)).filter(Boolean), mixed=mode==='mix';
  const pools=cls.map(cl=>shuffle(testPool(cl, mixed)));
  const qs=[]; let r=0;
  while(qs.length<n && pools.some(p=>p.length)){ const p=pools[r++%pools.length]; if(p.length) qs.push(p.pop()); } // round-robin so every checklist shows up
  shuffle(qs);
  for(const q of qs){
    q.opts=q.type==='n'?stepOpts(q.cl, q.its, q.k, false):respOpts(q.cl, q.it);
    if(mixed){
      const others=shuffle(testable().filter(c=>c!==q.cl && !sameIn(q,c)));
      const fromSel=others.filter(c=>ids.includes(c.id)), rest=others.filter(c=>!ids.includes(c.id));
      q.clOpts=shuffle([q.cl, ...fromSel.concat(rest).slice(0,3)]);
    }
  }
  return {mode, ids, qs, i:0, phase:'ans', picked:null, clWrong:[], score:0, clFirst:0, missed:[]};
}
function qPrompt(q, mixed){
  if(q.type==='r'){ const [qh]=qa(q.it); return q.cl.data?qh:`${qh} – <span class="dim">?</span>`; }
  if(q.k===0) return 'מה הסעיף הראשון בבד״ח?';
  return `מה הסעיף שבא אחרי:<div class="prev">${F(q.its[q.k-1].text)}</div>`;
}
function renderQuiz(){
  if(TS.mode==='num'){ renderNum(); V.insertAdjacentHTML('afterbegin','<button class="btn" id="tback" style="margin-bottom:8px">→ חזרה למבחנים</button>'); document.getElementById('tback').onclick=()=>{ TS={mode:"menu"}; render(); }; return; }
  if(TS.mode==='menu') return renderTestMenu();
  const T=TS;
  if(T.i>=T.qs.length) return renderTestEnd();
  const q=T.qs[T.i], mixed=T.mode==='mix', answered=T.picked!=null;
  const ctx=mixed?(T.phase==='next'?`${escS(q.cl.t)} <span class="stars">${starTxt(q.cl.s)}</span>`:'<span class="chip" style="color:var(--amber)">בד״ח מעורב · איזה בד״ח? תגלה אחרי התשובה</span>')
    :`${escS(q.cl.t)} <span class="stars">${starTxt(q.cl.s)}</span>${q.it.head?' · '+F(q.it.head):''}`;
  const optBtns=q.opts.map((o,k)=>{ let cls=''; if(answered){ if(o.ok) cls='right'; else if(k===T.picked) cls='wrong'; }
    return `<button class="${cls}" data-k="${k}" ${answered?'disabled':''}><span class="mono dim">${k+1}</span>&nbsp; ${F(o.t)}</button>`; }).join('');
  let stage2='';
  if(answered && mixed){
    stage2=`<div class="which"><div class="eyebrow">${T.phase==='which'?'כדי להמשיך:':'נכון'}</div><div style="font-size:19px;font-weight:700;margin:4px 0 2px">מאיזה בד״ח הסעיף הזה?</div>
      <div class="opts">${q.clOpts.map((c,k)=>{ const ok=c===q.cl||sameIn(q,c); let cls=''; if(T.clWrong.includes(k)) cls='wrong'; else if(T.phase==='next'&&ok) cls='right';
        return `<button class="${cls}" data-w="${k}" ${T.phase==='next'||T.clWrong.includes(k)?'disabled':''}><span class="mono dim">${'אבגד'[k]}</span>&nbsp; ${escS(c.t)} <span class="stars">${starTxt(c.s)}</span></button>`; }).join('')}</div>
      ${T.clWrong.length&&T.phase==='which'?'<p class="mute" style="margin:6px 0 0">לא. נסה שוב – לא ממשיכים עד שתזהה את הבד״ח.</p>':''}</div>`;
  }
  const canNext=answered && (!mixed || T.phase==='next');
  V.innerHTML=`<div class="row" style="margin-bottom:8px"><button class="btn" id="tq">✕ יציאה</button><span class="grow"></span><span class="mono mute" style="font-size:13px">${T.i+1}/${T.qs.length} · ${T.score} נכונות</span></div>
    <div class="row" style="margin-bottom:8px;gap:3px">${T.qs.map((_,k)=>`<span style="flex:1;height:4px;border-radius:2px;background:${k<T.i?'var(--arc-green)':k===T.i?'var(--sky)':'var(--line)'}"></span>`).join('')}</div>
    <div class="panel rivets" id="qp"><div class="mute" style="font-size:13px">${ctx}</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px">${qPrompt(q, mixed)}</div>
      <div class="opts">${optBtns}</div>
      ${answered&&q.it.x&&canNext?`<p class="mute">${F(q.it.x)}</p>`:''}
      ${stage2}
      ${canNext?`${termChips(q.it.text+' '+(q.it.a||''))}<button class="btn pri" id="tn" style="margin-top:12px">${T.i+1<T.qs.length?'הבא (רווח)':'לתוצאה'}</button>`:''}</div>`;
  document.getElementById('tq').onclick=()=>{ TS={mode:'menu'}; render(); };
  V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>testPick(+b.dataset.k));
  V.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>testWhich(+b.dataset.w));
  const n=document.getElementById('tn'); if(n) n.onclick=testNext;
  if(answered && mixed && T.phase==='which') V.querySelector('.which').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function testPick(k){
  const T=TS, q=T.qs[T.i]; if(T.picked!=null || !q.opts[k]) return;
  T.picked=k; const ok=q.opts[k].ok;
  if(ok) T.score++; else { T.missed.push(q); sendToReview(q.it); }
  track(q.cl.id, q.it.i, ok); logEv('q', ok); aiNudge(ok);
  if(T.mode==='mix') T.phase='which';
  save(); renderQuiz();
  const b=V.querySelector(`[data-k="${k}"]`); if(ok) pop('✓', b); else shake(document.getElementById('qp'));
}
function testWhich(k){
  const T=TS, q=T.qs[T.i]; if(T.phase!=='which' || T.clWrong.includes(k)) return;
  const c=q.clOpts[k];
  if(c===q.cl || sameIn(q,c)){ if(!T.clWrong.length) T.clFirst++; T.phase='next'; renderQuiz(); pop('✓', V.querySelector(`[data-w="${k}"]`)); }
  else { T.clWrong.push(k); aiNudge(false); renderQuiz(); shake(V.querySelector('.which')); }
}
function testNext(){ const T=TS; T.i++; T.picked=null; T.phase='ans'; T.clWrong=[]; renderQuiz(); scrollTo({top:0}); }
function renderTestEnd(){
  const T=TS, n=T.qs.length, pct=Math.round(100*T.score/n), key=T.mode+':'+T.ids.slice().sort().join(',');
  const tb=S.testBest||(S.testBest={}); const prev=tb[key]; tb[key]=Math.max(prev||0,pct); save();
  if(pct>=80) flyBy(true);
  V.innerHTML=`<div class="panel rivets fc"><div class="eyebrow">${T.mode==='mix'?'מבחן מעורב':'מבחן'}</div>

    <div class="mute">${pct}% תשובות נכונות${T.mode==='mix'?` · זיהית את הבד״ח בניסיון ראשון ב-${T.clFirst}/${n}`:''}${prev!=null?` · שיא קודם ${prev}%`:''}</div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" id="tagain">אותו מבחן שוב</button><button class="btn" id="tmenu">מבחן אחר</button></div></div>
    ${T.missed.length?`<div class="sec-title"><h2>טעויות (נכנסו לחזרה בכרטיסיות)</h2></div><div class="weak">${T.missed.map(q=>`<div><b>✗</b><span class="grow">${q.type==='r'?qa(q.it).join(' – '):F(q.it.text)}<br><span class="dim" style="font-size:12px">${escS(q.cl.t)} · סעיף ${q.it.n}</span></span></div>`).join('')}</div>`:''}`;
  document.getElementById('tagain').onclick=()=>{ TS=buildTest(T.mode, T.ids, n); render(); };
  document.getElementById('tmenu').onclick=()=>{ TS={mode:'menu'}; render(); };
}

function explainPt(p){

    <div class="sec-title"><h2>המסדרונות</h2>${mb&&mb.n?`<span class="mute" style="font-size:13px">דיוק בתרגול: ${Math.round(100*mb.o/mb.n)}%</span>`:''}</div>
    ${CORR.map((k,ci)=>`<div class="panel corr"><div class="row"><b class="grow"><span style="color:${colHex(k.c)}">●</span> ${escS(corrName(k))}</b><button class="btn" data-tour="${ci}">סיור ✈</button></div>
      <div class="chain">${k.pts.map((p,i)=>`<span class="cp" data-go="p|${escS(p)}">${escS(p)}</span>${i<k.pts.length-1?`<span class="ca" style="color:${colHex(k.c)}">← ${ltr(legOf(p,k.pts[i+1]).alt)}</span>`:''}`).join('')}</div>

    <div class="panel"><table class="mtab"><tr><th>אזור</th><th>גבהים (רגל)</th></tr>${MAP.areas.map(a=>`<tr data-go="a|${a.id}"><td class="mono"><b>${a.id}</b></td><td class="mono">${ltr(a.alt)}${a.v?' <span class="dim">(לאמת)</span>':''}</td></tr>`).join('')}</table>
    <p class="mute" style="font-size:13px;margin:8px 0 0">${AREA_TIP} המספרים 490/480/500/660/670/680 הם אזורים נוספים שמופיעים במפה בלי גבהי אימון.</p></div>

// ---- guided tour: the plane flies a corridor and explains each stop, then you fly it ----
function newTour(ci){ return {ci, i:0, phase:'learn', sub:'next', wrong:[], miss:0, opts:null}; }
function flyTo(from,to,done){
  const g=document.getElementById('mplane'); MS.busy=true;
  const r=Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI+90, t0=performance.now(), dur=RM?1:1300;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(g) g.setAttribute('transform',`translate(${from.x+(to.x-from.x)*e} ${from.y+(to.y-from.y)*e}) rotate(${r})`);
    if(k<1) requestAnimationFrame(step); else { MS.busy=false; done(); } };
  requestAnimationFrame(step);
}
function tourView(){
  const T=MS.tour; const pick=`<div class="pick">${CORR.map((k,ci)=>`<button class="${T&&T.ci===ci?'on':''}" data-tc="${ci}"><span style="color:${colHex(k.c)}">●</span> ${escS(corrName(k))}</button>`).join('')}</div>`;
  const bindPick=()=>V.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{ MS.tour=newTour(+b.dataset.tc); renderMapKeep(); });
  if(!T) return {svg:mapSVG(''), side:`<div class="eyebrow">סיור מודרך</div><p>מטוס טס לאורך מסדרון ועוצר בכל נקודה עם הסבר. אחר כך אתה טס אותו לבד – והשמות במפה מוסתרים.</p>${pick}`, bind:bindPick};
  const k=CORR[T.ci], P=k.pts.map(ptBy), n=P.length, cur=P[T.i];
  const drawn=k.pts.slice(0,T.i).map((p,j)=>legLine(P[j],P[j+1],k.c)).join('');
  const nextP=P[T.i+1], prevP=P[T.i-1], rot=nextP?Math.atan2(nextP.y-cur.y,nextP.x-cur.x)*180/Math.PI+90:(prevP?Math.atan2(cur.y-prevP.y,cur.x-prevP.x)*180/Math.PI+90:0);
  const marks=drawn+(T.phase==='learn'?P.map(p=>ring(p.x,p.y,22,'rgba(255,176,32,.5)')).join('')+P.slice(0,T.i+1).map(p=>label(p.x,p.y,p.n)).join(''):P.slice(0,T.i+1).map(p=>label(p.x,p.y,p.n)).join(''));
  const svg=mapSVG(marks,{plane:{x:cur.x,y:cur.y,r:rot}, blur:T.phase!=='learn'});
  let side=`<div class="eyebrow" style="color:${colHex(k.c)}">${escS(corrName(k))} · ${T.phase==='learn'?'לומדים':'עכשיו אתה טס'}</div>`;
  let bind=()=>{};
  if(T.phase==='learn'){
    if(T.i<n-1){ const lg=legOf(k.pts[T.i],k.pts[T.i+1]);
      side+=`<h3 style="margin:4px 0;font-size:22px">${T.i+1}. ${escS(cur.n)}</h3>
        <p>${T.i===0?'נקודת הפתיחה של המסדרון. ':''}הבא: <b>${escS(nextP.n)}</b>, ${dirWord(cur,nextP)}, בגובה <b class="mono">${ltr(lg.alt)}</b>.</p>${lg.v?'<div class="verify">⚠ רגל זו פחות ברורה בצילום – לאמת.</div>':''}
        <button class="btn pri block" id="tgo" style="margin-top:10px">טוס ל${escS(nextP.n)} ✈</button>`;
      bind=()=>{ document.getElementById('tgo').onclick=()=>{ if(MS.busy) return; flyTo(cur,nextP,()=>{ T.i++; renderMapKeep(); }); }; };
    } else {
      side+=`<h3 style="margin:4px 0;font-size:22px">${escS(cur.n)} – סוף המסדרון</h3><p>מכאן ממשיכים אל ${k.to}.</p><p class="mute" style="font-size:14px">${k.tip}</p>
        <button class="btn pri block" id="tq">עכשיו אתה – טוס את זה לבד</button>`;
      bind=()=>{ document.getElementById('tq').onclick=()=>{ Object.assign(T,{phase:'quiz',i:0,sub:'next',wrong:[],miss:0,opts:null}); renderMapKeep(); }; };
    }
  } else if(T.phase==='quiz' && T.i<n-1){
    const right=T.sub==='next'?nextP.n:legOf(k.pts[T.i],k.pts[T.i+1]).alt;
    if(!T.opts) T.opts=T.sub==='next'?four(right,near(cur,6).map(p=>p.n).filter(x=>x!==k.pts[T.i-1])):four(right,RALT_POOL);
    side+=`<div class="mute mono" style="font-size:13px">נקודה ${T.i+1}/${n} · טעויות ${T.miss}</div>
      <h3 style="margin:4px 0;font-size:20px">${T.sub==='next'?`אתה ב${escS(cur.n)}. לאן ממשיכים?`:`${escS(cur.n)} ← ${escS(nextP.n)}: באיזה גובה?`}</h3>
      <div class="opts">${T.opts.map((o,j)=>`<button class="${T.wrong.includes(j)?'wrong':''}" data-to="${j}" ${T.wrong.includes(j)?'disabled':''}>${ltr(o)}</button>`).join('')}</div>
      ${T.wrong.length?`<p class="mute" style="font-size:14px;margin:8px 0 0">${T.sub==='next'?`רמז: הנקודה הבאה נמצאת ${dirWord(cur,nextP)} מכאן.`:`רמז: ${k.tip}`}</p>`:''}`;
    bind=()=>V.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{ if(MS.busy) return; const j=+b.dataset.to;
      if(T.opts[j]!==right){ T.wrong.push(j); T.miss++; track('map','tour:'+k.id+':'+T.i+T.sub,false); aiNudge(false); renderMapKeep(); shake(document.getElementById('mside')); return; }
      if(!T.wrong.length) track('map','tour:'+k.id+':'+T.i+T.sub,true);
      pop('✓',b); T.wrong=[]; T.opts=null;
      if(T.sub==='next'){ T.sub='alt'; renderMapKeep(); }
      else flyTo(cur,nextP,()=>{ T.i++; T.sub='next'; renderMapKeep(); }); });
  } else {
    if(!T.saved){ T.saved=true; const mb=S.mapBest||{n:0,o:0}; mb.n+=n-1; mb.o+=Math.max(0,n-1-T.miss); S.mapBest=mb; logEv('m',T.miss===0); save(); if(!T.miss) flyBy(true); }
    side+=`<h3 style="margin:4px 0;font-size:22px">הגעת ל${escS(cur.n)} ✓</h3><p>${T.miss?`${T.miss} טעויות בדרך – שווה לעשות סיבוב נוסף.`:'בלי טעויות. מעולה.'}</p><p class="mute" style="font-size:14px">${k.tip}</p>
      <div class="row"><button class="btn pri grow" id="tre">שוב</button><button class="btn grow" id="tnx">המסדרון הבא</button></div>`;
    bind=()=>{ document.getElementById('tre').onclick=()=>{ MS.tour=newTour(T.ci); renderMapKeep(); }; document.getElementById('tnx').onclick=()=>{ MS.tour=newTour((T.ci+1)%CORR.length); renderMapKeep(); }; };
  }
  side+=`<div style="margin-top:14px">${pick}</div>`;
  return {svg, side, focus:cur, bind(){ bind(); bindPick(); }};
}

// ---- route builder: tap the points in order ----
function buildView(){
  const B=MS.build;
  const pick=`<div class="pick">${CORR.map((k,ci)=>`<button class="${B&&B.ci===ci?'on':''}" data-bc="${ci}">${escS(k.pts[0])} → ${escS(k.pts[k.pts.length-1])}</button>`).join('')}</div>`;
  const bindPick=()=>V.querySelectorAll('[data-bc]').forEach(b=>b.onclick=()=>{ MS.build={ci:+b.dataset.bc, i:0, miss:0, stepMiss:0, msg:''}; renderMapKeep(); });
  if(!B) return {svg:mapSVG(''), side:`<div class="eyebrow">בנה מסלול</div><p>בחר מסלול. השמות במפה מוסתרים: אתה מתחיל בנקודה הראשונה, וצריך לגעת בעיגולים של נקודות הדיווח לפי הסדר. כל נגיעה נכונה משרטטת את הרגל ומראה את הגובה.</p>${pick}`, bind:bindPick};
  const k=CORR[B.ci], P=k.pts.map(ptBy), n=P.length, cur=P[B.i], done=B.i>=n-1;
  let marks=k.pts.slice(0,B.i).map((p,j)=>legLine(P[j],P[j+1],k.c)).join('')+P.slice(0,B.i+1).map(p=>label(p.x,p.y,p.n)).join('')+ring(cur.x,cur.y,26,'#ffb020');
  if(!done && B.stepMiss>=2) marks+=ring(P[B.i+1].x,P[B.i+1].y,30,'#3dd283');
  if(B.bad) marks+=`<circle cx="${B.bad.x}" cy="${B.bad.y}" r="16" fill="#ff5d50" stroke="#000" stroke-width="3"/>`;
  const legs=k.pts.slice(0,B.i).map((p,j)=>`<div class="rrow"><span style="color:${colHex(k.c)}">${j+1}</span><span class="grow">${escS(p)} ← ${escS(k.pts[j+1])}</span><b class="mono">${ltr(legOf(p,k.pts[j+1]).alt)}</b></div>`).join('');
  let side=`<div class="eyebrow" style="color:${colHex(k.c)}">${escS(corrName(k))}</div>`;
  if(!done) side+=`<h3 style="margin:4px 0;font-size:20px">אתה ב${escS(cur.n)}. גע בנקודה הבאה במפה.</h3>${B.msg?`<p style="margin:6px 0">${B.msg}</p>`:''}<div class="mute mono" style="font-size:13px">רגל ${B.i+1}/${n-1} · טעויות ${B.miss}</div>`;
  else { if(!B.saved){ B.saved=true; const mb=S.mapBest||{n:0,o:0}; mb.n+=n-1; mb.o+=Math.max(0,n-1-B.miss); S.mapBest=mb; logEv('m',B.miss===0); save(); if(!B.miss) flyBy(true); }
    side+=`<h3 style="margin:4px 0;font-size:22px">המסלול שלם ✓</h3><p>${B.miss?`${B.miss} טעויות.`:'בלי טעויות.'} ${k.tip}</p><button class="btn pri block" id="bre">שוב</button>`; }
  side+=`<div style="margin-top:10px">${legs}</div><div style="margin-top:12px">${pick}</div>`;
  return {svg:mapSVG(marks,{blur:true,dots:true}), side, focus:cur, bind(){ bindPick();
    const r=document.getElementById('bre'); if(r) r.onclick=()=>{ MS.build={ci:B.ci,i:0,miss:0,stepMiss:0,msg:''}; renderMapKeep(); };
    if(done) return;
    document.getElementById('msvg').onclick=e=>{ const m=svgPt(e), p=nearestPt(m), want=P[B.i+1];
      if(!p){ B.msg='גע באחד העיגולים – כל עיגול הוא נקודת דיווח.'; B.bad=null; renderMapKeep(); return; }
      if(p===cur) return;
      if(p===want){ const lg=legOf(cur.n,want.n); track('map','build:'+k.id+':'+B.i,B.stepMiss===0);
        B.msg=`✓ ${escS(want.n)} – הרגל ${escS(cur.n)} ← ${escS(want.n)} בגובה <b class="mono">${ltr(lg.alt)}</b>.`; B.i++; B.stepMiss=0; B.bad=null; aiNudge(true); renderMapKeep(); return; }
      B.miss++; B.stepMiss++; B.bad=p; aiNudge(false);
      const skip=k.pts.indexOf(p.n)>B.i+1;
      B.msg=`✗ זו ${escS(p.n)}. ${skip?'דילגת – יש נקודה לפניה. ':''}הנקודה הבאה נמצאת ${dirWord(cur,want)} מ${escS(cur.n)}${B.stepMiss>=2?' (מסומנת בירוק)':''}.`;
      renderMapKeep(); shake(document.getElementById('mside')); };
  }};
}

// ---- blank map: names are blurred away; place points and areas from memory ----
function newBlank(help){
  const items=shuffle([...MAP.pts.map(p=>({t:'pt',o:p})), ...MAP.areas.map(a=>({t:'ar',o:a}))]);
  return {help, q:items, i:0, done:null, ok:0, tries:0};
}
function blankView(){
  const B=MS.blank;
  const lv=`<div class="pick"><button class="${B&&B.help?'on':''}" data-bl="1">עם עיגולים (קל)</button><button class="${B&&!B.help?'on':''}" data-bl="0">בלי עזרה (קשה)</button></div>`;
  const bindLv=()=>V.querySelectorAll('[data-bl]').forEach(b=>b.onclick=()=>{ MS.blank=newBlank(b.dataset.bl==='1'); renderMapKeep(); });
  if(!B) return {svg:mapSVG('',{blur:true}), side:`<div class="eyebrow">מפה עיוורת</div><p>השמות והמספרים במפה מטושטשים. מקבלים שם של נקודה או אזור – וצריך לגעת איפה הוא. אחרי כל תשובה מופיע הסבר.</p>${lv}`, bind:bindLv};
  if(B.i>=B.q.length){ if(!B.saved){ B.saved=true; const mb=S.mapBest||{n:0,o:0}; mb.n+=B.tries; mb.o+=B.ok; S.mapBest=mb; save(); }
    return {svg:mapSVG(MAP.pts.map(p=>label(p.x,p.y,p.n)).join('')+MAP.areas.map(a=>label(a.x,a.y+20,a.id,'#1a4fd0')).join(''),{blur:true}),
      side:`<h3 style="margin:4px 0;font-size:22px">סיימת ✓</h3><p>${B.ok} מתוך ${B.tries} ניסיונות היו נכונים. מה שטעית בו חזר שוב בסבב.</p><button class="btn pri block" id="bla">שוב</button><div style="margin-top:10px">${lv}</div>`,
      bind(){ bindLv(); document.getElementById('bla').onclick=()=>{ MS.blank=newBlank(B.help); renderMapKeep(); }; }};
  }
  const it=B.q[B.i], o=it.o, isPt=it.t==='pt';
  let marks=B.q.slice(0,B.i).filter(x=>x.ok).map(x=>x.t==='pt'?label(x.o.x,x.o.y,x.o.n,'#14632e'):label(x.o.x,x.o.y+20,x.o.id,'#14632e')).join('');
  if(B.done){ marks+=ring(o.x,o.y,isPt?30:60,B.done.ok?'#3dd283':'#ffb020')+(isPt?label(o.x,o.y,o.n):label(o.x,o.y+20,'אזור '+o.id,'#1a4fd0'));
    if(B.done.tap) marks+=`<circle cx="${B.done.tap.x}" cy="${B.done.tap.y}" r="14" fill="${B.done.ok?'#3dd283':'#ff5d50'}" stroke="#000" stroke-width="3"/>`; }
  const side=`<div class="mute mono" style="font-size:13px">${B.i+1}/${B.q.length} · ${B.ok} נכונות</div>
    <h3 style="margin:4px 0;font-size:22px">${isPt?`איפה ${escS(o.n)}?`:`איפה אזור ${o.id}?`}</h3>
    ${B.done?`<p style="margin:6px 0;color:${B.done.ok?'var(--arc-green)':'var(--arc-red)'}">${B.done.ok?'✓ נכון':'✗ לא שם – הנה המקום (נחזור לזה)'}</p><p style="font-size:15px">${isPt?explainPt(o):explainArea(o)}</p><button class="btn pri block" id="bln">הבא</button>`
      :`<p class="mute">${B.help&&isPt?'גע בעיגול הנכון.':isPt?'גע במקום של המשולש.':'גע בתוך האזור (ליד המספר).'}</p>`}
    <div style="margin-top:12px">${lv}</div>`;
  return {svg:mapSVG(marks,{blur:true,dots:B.help}), side, bind(){ bindLv();
    const nx=document.getElementById('bln'); if(nx) nx.onclick=()=>{ B.done=null; B.i++; renderMapKeep(); };
    if(B.done) return;
    document.getElementById('msvg').onclick=e=>{ const m=svgPt(e); let ok;
      if(isPt){ const p=B.help?nearestPt(m,40):null; ok=B.help?p===o:Math.hypot(m.x-o.x,m.y-o.y)<70; if(B.help&&!p) return; }
      else ok=Math.hypot(m.x-o.x,m.y-o.y)<110;
      B.tries++; if(ok){ B.ok++; it.ok=true; } else B.q.splice(Math.min(B.q.length,B.i+4),0,{...it,ok:false});
      track('map','blank:'+(isPt?o.n:o.id),ok); logEv('m',ok); aiNudge(ok);
      B.done={ok, tap:m}; renderMapKeep(); if(!ok) shake(document.getElementById('mside')); };
  }};
}

// ---- quick review ----
function quizView(){
  const q=MS.q||(MS.q=newMapQ());
  let marks='';
  if(q.a && q.t!=='alt') marks=ring(q.a.x,q.a.y,52);
  if(q.p && q.t==='whichPt') marks=ring(q.p.x,q.p.y,30);
  if(q.t==='loc' && q.done){ marks=ring(q.p.x,q.p.y,30,'#3dd283')+(q.tap?`<circle cx="${q.tap[0]}" cy="${q.tap[1]}" r="12" fill="${q.ok?'#3dd283':'#ff5d50'}" stroke="#000" stroke-width="3"/>`:''); }
  if(q.t==='route'){ const a=ptBy(q.r.a), b=ptBy(q.r.b); marks=ring(a.x,a.y,26)+ring(b.x,b.y,26); }

// ---------- Transition flight model (used by the cockpit sim's transitions) ----------
// A teaching model, not a full flight model. Numbers follow the checklist where it gives them: climb 25״ at about VY 102 kt,
// level 20״, glide 90 kt with flaps T/O, levelling 20 ft / 300 ft / 50 ft before the altitude, the trim values, and the gear-up warning at idle.
const isTr=cl=>!!cl&&/^tr\d+$/.test(cl.id);
const TRX=()=>D.filter(isTr);
const TR_REG={level:{mp:20,pitch:0,flaps:0}, climb:{mp:25,pitch:8,flaps:0}, glide:{mp:12,pitch:-4,flaps:1}, desc:{mp:12,pitch:-3,flaps:0}};
// Starting regime, bank and altitude for each transition; tgt = the altitude being levelled at (gates count feet from it).
const TR_START={tr1:{r:'level',alt:3000}, tr2:{r:'climb',alt:3330,tgt:3500}, tr3:{r:'level',alt:3500}, tr4:{r:'glide',alt:3100,tgt:2500},
  tr5:{r:'level',alt:3500}, tr6:{r:'desc',alt:3250,tgt:3000}};
const trVeq=f=>120+(f.mp-20)*4-f.pitch*(f.pitch>0?4.5:3)-f.flaps*8;   // speed it settles at (kt): level 120, climb ~102, glide ~90
const trVs=f=>f.pitch*120+(f.mp-20)*15;   // climb rate it settles at (ft/min): mostly from pitch; climb ~1,000, glide ~600 down
// A gate line ("20׳ לפני הגובה:" / "במהירות 110 קשר:") becomes a condition the flight must reach.
function trGate(text, f, st){
  const t=clean(text), n=+((t.match(/(\d+)/)||[])[1]||0);
  // Which way the speed is heading decides the crossing; if it's already past (a slow trainee), the gate opens at once.
  if(/מהירות/.test(t)){ const dir=Math.sign(trVeq(f)-f.v)||1; return {txt:`במהירות ${n} קשר`, done:()=>(n-f.v)*dir<=0.3}; }
  // Direction of travel (not position) decides the crossing, so a late start can't miss the gate.
  if(/לפני הגובה/.test(t) && st.tgt){ const up=Math.abs(f.vs)>50?f.vs>0:st.tgt>f.alt, at=st.tgt+(up?-n:n); return {txt:`${n} רגל לפני ${st.tgt.toLocaleString('en-US')}`, done:()=>up?f.alt>=at:f.alt<=at}; }
  return null;
}

function trFlight(R, alt, bank, area){

function trHud(){

    +row('קצב',(f.vs>=0?'+':'')+Math.round(f.vs/10)*10+' fpm','vs')+row('מצערת',f.mp.toFixed(1)+'״','mp')+row('אף',(f.pitch>0?'+':'')+f.pitch.toFixed(1)+'°','pitch')
    +row('הטיה',Math.round(Math.abs(f.bank))+'°','bank')+row('מדפים',f.flaps>.5?'T/O':'UP','flaps')+row('מקזז',(f.trim>0?f.trim+' אחור':f.trim<0?-f.trim+' קדימה':'0'),'trim')

function trLoop(now){
  const s=TR3; if(!s) return;
  const dt=Math.max(0,Math.min(.05,(now-s.last)/1000))*s.fast; s.last=now;
  const f=s.f, ap=(a,b,r)=>a+Math.max(-r*dt,Math.min(r*dt,b-a));
  f.mp=ap(f.mp,f.mpT,8); f.pitch=ap(f.pitch,f.pitchT,4); f.flaps=ap(f.flaps,f.flapsT,.6); f.bank=ap(f.bank,f.bankT,10);
  f.v+=(trVeq(f)-f.v)*(1-Math.exp(-dt/5)); f.vs+=(trVs(f)-f.vs)*(1-Math.exp(-dt/1.2));
  f.alt+=f.vs/60*dt;
  const turn=1091*Math.tan(f.bank*Math.PI/180)/Math.max(60,f.v)*Math.PI/180;   // standard turn-rate formula, rad/s
  f.head-=turn*dt; const fps=f.v*1.688;
  f.x-=Math.sin(f.head)*fps*dt; f.z-=Math.cos(f.head)*fps*dt;
  if(f.horn>0) f.horn-=dt/s.fast;
  if(f.flash){ f.flashT=(f.flashT||0)+dt; if(f.flashT>2){ f.flash=null; f.flashT=0; } }
  trDraw(s.g, f, now, s.camK||1, s.high);
  if(now-(s.hudT||0)>120){ s.hudT=now; trHud(); }
  s.raf=requestAnimationFrame(trLoop);
}

  const sc=new T.Scene(), sky=new T.Color('#8fc1ea'); sc.background=sky; sc.fog=new T.Fog(sky, 12000, 90000);

  const white=new T.MeshStandardMaterial({color:'#f4f5f2',roughness:.45,metalness:.1}), stripe=new T.MeshStandardMaterial({color:'#e2552b',roughness:.5});
  const glass=new T.MeshStandardMaterial({color:'#2b4f6e',roughness:.1,metalness:.3,transparent:true,opacity:.75}), dark=new T.MeshStandardMaterial({color:'#2a2d31',roughness:.6});
  const prof=[[0,-3.9],[.18,-3.85],[.42,-3.6],[.58,-3.0],[.62,-2],[.6,-1],[.52,0],[.38,1.4],[.22,2.9],[.12,3.6],[0,3.7]].map(([r,z])=>new T.Vector2(r,z));
  const fus=new T.Mesh(new T.LatheGeometry(prof,24), white); fus.rotation.x=Math.PI/2; fus.scale.set(1,1,.92); body.add(fus);
  const can=new T.Mesh(new T.SphereGeometry(1,24,16), glass); can.scale.set(.5,.42,1.25); can.position.set(0,.42,-1.1); body.add(can);

  const ht=new T.Mesh(new T.BoxGeometry(3.4,.1,.85), white); ht.position.set(0,.05,3.25); body.add(ht);
  const vt=new T.Mesh(new T.BoxGeometry(.1,1.4,1.1), white); vt.position.set(0,.75,3.3); vt.rotation.x=-.25; body.add(vt);
  const vs=new T.Mesh(new T.BoxGeometry(.12,.5,.9), stripe); vs.position.set(0,1.25,3.45); vs.rotation.x=-.25; body.add(vs);
  const spin=new T.Mesh(new T.ConeGeometry(.2,.5,16), white); spin.rotation.x=-Math.PI/2; spin.position.z=-4.1; body.add(spin);

  const size=()=>{ const w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight; ren.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); };
  size(); addEventListener('resize', size);
  const disposables=[]; sc.traverse(o=>{ if(o.geometry) disposables.push(o.geometry); if(o.material) disposables.push(o.material); }); disposables.push(mtex);

function trDraw(g, f, now, camK, high){
  const T=THREE, P=g.P, d2r=Math.PI/180;
  P.position.set(f.x, f.alt, f.z);
  P.rotation.set(f.pitch*d2r, f.head, -f.bank*d2r, 'YXZ');
  g.prop.rotation.z+=(.2+f.mp/27)*.9; g.disc.material.opacity=.06+.1*(f.mp/27);
  g.flapL.forEach(fp=>fp.rotation.x=f.flaps*.35);
  g.ground.position.set(Math.round(f.x/g.TILE)*g.TILE, 0, Math.round(f.z/g.TILE)*g.TILE);
  const fw=new T.Vector3(-Math.sin(f.head),0,-Math.cos(f.head)), side=new T.Vector3(-fw.z,0,fw.x);
  const wob=Math.sin(now/1700)*2;
  const k=Math.max(1,1.1/g.cam.aspect)*camK;   // tall phone screens: pull back so the whole wingspan fits; area quiz looks from further back
  if(high){ g.cam.position.copy(P.position); g.cam.lookAt(P.position.clone().addScaledVector(fw,1000).add(new T.Vector3(0,-260,0)));
    g.cam.rotateZ(-f.bank*d2r); g.ren.render(g.sc, g.cam); return; }
  g.cam.position.copy(P.position).addScaledVector(fw,-95*k).addScaledVector(side,wob).add(new T.Vector3(0,12*k,0));
  g.cam.lookAt(P.position.clone().addScaledVector(fw,60*k).add(new T.Vector3(0,-21*k,0)));   // plane sits in the upper third, above the question card
  g.ren.render(g.sc, g.cam);
}

// ---------- Simulator: pick the right action, then watch your hand do it in the cockpit ----------
// Each step shows four near-miss options. A wrong pick is called out and the step waits until you get it right.
const MECH={
  batt:{m:'tog',st:['OFF','ON']}, alt:{m:'tog',st:['OFF','ON']}, avio:{m:'tog',st:['OFF','ON']}, beacon:{m:'tog',st:['OFF','ON']},
  lights:{m:'tog',st:['OFF','ON']}, pitot:{m:'tog',st:['OFF','ON']}, fpump:{m:'tog',st:['OFF','ON']}, vent:{m:'tog',st:['OFF','ON']},
  bustie:{m:'tog',st:['AUTO','MAN']}, pbrake:{m:'tog',st:['OFF','ON']}, gear:{m:'tog',st:['DOWN','UP']}, flaps:{m:'tog',st:['LAND','T/O','UP']},
  egear:{m:'tog',st:['NORMAL','EMERG']}, canopy:{m:'tog',st:['OPEN','CLOSED']}, altair:{m:'tog',st:['IN','OUT']},
  vtr:{m:'rot',st:['OFF','STBY','REC']}, xpdr:{m:'rot',st:['OFF','STBY','ALT']}, key:{m:'rot',st:['OFF','R','L','BOTH']}, fsel:{m:'rot',st:['LEFT','RIGHT']},
  thr:{m:'lev'}, prop:{m:'lev'}, mix:{m:'lev'}, trim:{m:'trim'}, stick:{m:'stick'},
};
const skey=id=>id==='mags'?'key':id;
const CHANGE=/הפעל|הדלק|הפסק|כבה|הורד|הרם|העבר|שחרר|פתח|סגור|תקן|קזז|הכנס/;

// What a step does to its control, so the hand can perform it and the panel can show the result.
function targetOf(it, c){
  if(!c) return {k:'say'};
  const id=skey(c.id), m=MECH[id], a=clean(it.a||it.text), t=clean(it.text);
  if(!m) return {k:'chk'};
  if(m.m==='lev'){
    if(id==='prop'){ if(/אחורה וקדימה/.test(a)) return {k:'cycle'}; if(/מלא קדימה/.test(a)) return {k:'lev',v:1}; return {k:'chk'}; }
    if(id==='mix') return /ענייה/.test(a)?{k:'lev',v:0}:{k:'chk'};
    let mm;
    if((mm=t.match(/([\d,]{3,})\s*סל״ד/))) return {k:'rpm',v:+mm[1].replace(/,/g,'')};
    if((mm=t.match(/(\d+)״/))) return {k:'map',v:+mm[1]};
    if(id==='thr' && (mm=t.match(/ל-(\d{2})(?!\d)/)) && +mm[1]>=10 && +mm[1]<=30) return {k:'map',v:+mm[1]};   // "סגור ל-20" = 20״ MAP
    if(/סרק/.test(t)) return {k:'lev',v:0};
    if(/¼/.test(t)) return {k:'lev',v:.25};
    if(/חצי מהלך/.test(t)) return {k:'lev',v:.5};
    if(/מלא/.test(t)) return {k:'lev',v:1};
    return {k:'chk'};
  }
  if(m.m==='trim'){
    if(/T\/O/.test(a) && /החזר/.test(a)) return {k:'cycle'};
    const mm=a.match(/(\d+(?:\.\d+)?|אחד)\s*(לאחור|קדימה)/);
    if(mm){ const n=mm[1]==='אחד'?1:+mm[1]; return {k:'trimd', v:mm[2]==='לאחור'?n:-n}; }
    return {k:'chk'};
  }
  if(m.m==='stick'){
    if(/הטיה/.test(t)) return {k:'side'};
    if(/תנועה חופשית/.test(a)) return {k:'stir'};
    if(/הרם/.test(a)) return {k:'pull'};
    if(/הורד/.test(a)) return {k:'push'};
    return {k:'hold'};
  }
  if(id==='altair' && /סובב ומשוך/.test(a)) return {k:'cycle'};
  if(/וודא|ודא|בדוק|בראי/.test(a) && !CHANGE.test(a)) return {k:'chk'};
  for(const s of m.st) if(new RegExp('(^|[^A-Z/])'+escRe(s)+'($|[^A-Z/])').test(a)) return {k:'st',v:s};
  if(m.st.includes('ON')){ if(/הפעל|הדלק/.test(a)) return {k:'st',v:'ON'}; if(/הפסק|מופסק|כבה/.test(a)) return {k:'st',v:'OFF'}; }
  if(id==='pbrake' && /שחרר/.test(a)) return {k:'st',v:'OFF'};
  if(id==='gear'){ if(/הורד/.test(a)) return {k:'st',v:'DOWN'}; if(/הרם/.test(a)) return {k:'st',v:'UP'}; }
  if(id==='fsel' && /השני/.test(a)) return {k:'swap'};
  if(id==='canopy' && /סגור/.test(a)) return {k:'st',v:'CLOSED'};
  return {k:'chk'};
}

// Engine model: on the ground RPM follows the throttle; airborne the governor holds RPM and the throttle sets manifold pressure.
const engRPM=st=>!st.run?0:st.air?Math.round(2250+st.thr*450*(.5+st.prop/2)):Math.round(750+st.thr*1950);
const engMAP=st=>!st.run?29.9:+(12+st.thr*(st.air?16:14)).toFixed(1);
const MAPT=v=>(v-12)/16;
const BASE={run:false,air:false,batt:'OFF',alt:'OFF',avio:'OFF',beacon:'OFF',lights:'OFF',pitot:'OFF',fpump:'OFF',vent:'OFF',bustie:'AUTO',vtr:'OFF',xpdr:'OFF',
  key:'OFF',fsel:'LEFT',gear:'DOWN',flaps:'UP',pbrake:'OFF',egear:'NORMAL',canopy:'OPEN',altair:'IN',thr:0,prop:0,mix:.5,trim:0};
const G_START={...BASE,run:true,batt:'ON',bustie:'MAN',beacon:'ON',canopy:'CLOSED',pbrake:'ON',key:'BOTH',thr:.128,prop:1,mix:1};

const SWAPS=[['הפעל','הפסק'],['הורד','הרם'],['קדימה','לאחור'],['ON','OFF'],['STBY','ALT'],['REC','STBY'],['MAN','AUTO'],['שחרר','הפעל'],['פתח','סגור'],
  ['T/O','LAND'],['UP','T/O'],['BOTH','L'],['הדלק','כבה'],['מטה','למעלה'],['תחת','מעל'],['מלא','חצי מהלך'],['השני','השמאלי']];
const NUMS={'2,000':'2,200','1200':'1500','22':'25','13':'15','25':'20','20':'25','150':'136','136':'150','114':'120','75':'80','80':'87','87':'75','90':'80',
  '2.5':'1.5','1.5':'2.5','300':'500','50':'100','110':'90','40':'60','1000':'500','7':'5','6':'4','175':'150','20-70':'70-120','600-1000':'1000-1400','1':'2'};
const wordRe=w=>new RegExp('(^|[^\\u05D0-\\u05EAA-Za-z0-9/])('+escRe(w)+')(?=$|[^\\u05D0-\\u05EAA-Za-z0-9/])');
function mutate(text){
  const out=[];
  for(const [a,b] of SWAPS){ if(wordRe(a).test(text)) out.push(text.replace(wordRe(a),'$1'+b)); else if(wordRe(b).test(text)) out.push(text.replace(wordRe(b),'$1'+a)); }
  for(const n of Object.keys(NUMS)) if(wordRe(n).test(text)) out.push(text.replace(wordRe(n),'$1'+NUMS[n]));
  return out;
}

const AU={ctx:null,on:S.simSound!==false};
function auInit(){
  if(AU.ctx){ try{ AU.ctx.resume(); }catch(e){} return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{
    const ctx=AU.ctx=new C(), m=AU.master=ctx.createGain(); m.gain.value=AU.on?.8:0; m.connect(ctx.destination);
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    AU.nb=nb;
    const noise=()=>{ const s=ctx.createBufferSource(); s.buffer=nb; s.loop=true; s.start(); return s; };
    const eg=AU.eng=ctx.createGain(); eg.gain.value=0; eg.connect(m);
    const am=AU.am=ctx.createGain(); am.gain.value=1; am.connect(eg);
    const lp=AU.lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400; lp.Q.value=2; lp.connect(am);
    const o1=AU.o1=ctx.createOscillator(); o1.type='sawtooth'; const g1=ctx.createGain(); g1.gain.value=.55; o1.connect(g1).connect(lp); o1.start();
    const o2=AU.o2=ctx.createOscillator(); o2.type='square'; const g2=ctx.createGain(); g2.gain.value=.3; o2.connect(g2).connect(lp); o2.start();
    const lfo=AU.lfo=ctx.createOscillator(); lfo.frequency.value=6; const ld=AU.ld=ctx.createGain(); ld.gain.value=0; lfo.connect(ld).connect(am.gain); lfo.start();
    const bp=AU.bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9; const pg=AU.pg=ctx.createGain(); pg.gain.value=0; noise().connect(bp).connect(pg).connect(m);
    const wl=ctx.createBiquadFilter(); wl.type='lowpass'; wl.frequency.value=700; const wg=AU.wg=ctx.createGain(); wg.gain.value=0; noise().connect(wl).connect(wg).connect(m);
  }catch(e){ AU.ctx=null; }
}
function auSet(rpm, air){
  if(!AU.ctx) return;
  const t=AU.ctx.currentTime, f=Math.max(rpm,60)/60*3, k=(p,v)=>p.setTargetAtTime(v,t,.12);
  k(AU.o1.frequency,f); k(AU.o2.frequency,f/2); k(AU.lp.frequency,220+rpm*.45); k(AU.eng.gain,rpm?.1+rpm/2700*.2:0);
  k(AU.lfo.frequency,Math.max(rpm,60)/120); k(AU.ld.gain,rpm?(rpm<1300?.45:.12):0);
  k(AU.bp.frequency,f*4); k(AU.pg.gain,rpm/2700*.16); k(AU.wg.gain,air?.14:0);
}
function auMute(on){ AU.on=on; S.simSound=on; if(AU.ctx) AU.master.gain.setTargetAtTime(on?.8:0,AU.ctx.currentTime,.05); if(!on) try{ speechSynthesis.cancel(); }catch(e){} }
function fx(kind, dur=1){
  const ctx=AU.ctx; if(!ctx||!AU.on) return;
  const t=ctx.currentTime, g=ctx.createGain(); g.connect(AU.master);
  const env=(peak,len)=>{ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+len); };
  if(kind==='click'){ const s=ctx.createBufferSource(); s.buffer=AU.nb; const h=ctx.createBiquadFilter(); h.type='highpass'; h.frequency.value=2200; s.connect(h).connect(g); env(.5,.04); s.start(t,Math.random()); s.stop(t+.05); }
  else if(kind==='thunk'){ const o=ctx.createOscillator(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+.2); o.connect(g); env(.6,.25); o.start(t); o.stop(t+.3); }
  else if(kind==='buzz'){ const o=ctx.createOscillator(); o.type='square'; o.frequency.value=140; o.connect(g); env(.12,.28); o.start(t); o.stop(t+.3); }
  else if(kind==='motor'){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(175,t+dur); const l=ctx.createBiquadFilter(); l.type='lowpass'; l.frequency.value=800; o.connect(l).connect(g);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.1); g.gain.setValueAtTime(.07,t+dur-.1); g.gain.linearRampToValueAtTime(0,t+dur); o.start(t); o.stop(t+dur); }
  else if(kind==='horn'){ const o=ctx.createOscillator(); o.type='square'; o.frequency.value=560; o.connect(g); for(let i=0;i<dur*3;i++){ g.gain.setValueAtTime(.08,t+i/3); g.gain.setValueAtTime(0,t+i/3+.18); } o.start(t); o.stop(t+dur); }
  else if(kind==='starter'){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(40,t); o.frequency.linearRampToValueAtTime(140,t+1.3); const l=ctx.createBiquadFilter(); l.type='lowpass'; l.frequency.value=600; o.connect(l).connect(g);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.2); g.gain.linearRampToValueAtTime(0,t+1.5); o.start(t); o.stop(t+1.6); }
}

const simCur=()=>SIM&&SIM.steps[SIM.k];

function simBegin(){
  const s=SIM; if(!s||s.trWait||s.lost) return;   // flying toward a gate (it calls back when reached), or the 3D view was lost
  s.stepMiss=0; s.wrong=[]; s.st0={...s.st}; s.busy=false;
  if(s.k>=s.steps.length){ simFinish(); return; }
  const c=simCur();
  if(s.trf && !s.trWait && s.trGated!==s.k && viewMode()==='3d'){
    // A header like "20׳ לפני הגובה:" right before this step: fly (sped up) until it's true, then ask.
    const prev=s.k?s.steps[s.k-1].it.i:-1, head=c.it.cl.items.slice(prev+1, c.it.i).filter(x=>x.kind==='head').pop();
    const gate=head&&trGate(head.text, s.trf, TR_START[s.cl.id]);
    s.trGated=s.k;
    if(gate && !gate.done()){ s.trWait=gate; s.trf.fast=4; s.busy=true; s.opts=[]; simUpdate(); checkerSay('שים לב: '+gate.txt+'.', 'neutral'); return; }
  }
  if(c.auto){
    s.busy=true; s.opts=[]; simUpdate();
    checkerSay('אני מבצע: '+clean(c.it.text), 'neutral');
    perform(c,'inst').then(ok=>{ if(ok && SIM===s) stepDone(c,true); });

}
function simPick(i){
  const s=SIM; if(!s||s.busy||s.done||!s.started) return;
  const o=s.opts[i]; if(!o || s.wrong.includes(i)) return;
  s.lastAct=Date.now();
  if(!o.ok){
    s.wrong.push(i); s.miss++; s.stepMiss++;
    const c=simCur(); let msg=pick(LINES.bad);
    if(clean(o.t)===clean((s.steps[s.k+1]||{it:{text:''}}).it.text)) msg='דילגת על סעיף. מה בא קודם?';
    else if(c.c && ctrlFor({text:o.t,q:o.t.split('–')[0]})===c.c) msg='הבקר נכון. הפעולה לא.';
    checkerSay(msg, 'glare'); simFeedback(msg); aiNudge(false); fx('buzz');
    shake(document.querySelector(`[data-o="${i}"]`));
    if(s.mode==='train' && s.stepMiss>=2) s.hintOn=true;
    simUpdate(); return;
  }
  const c=simCur(); s.busy=true; s.hintOn=false; simUpdate();

function stepDone(c, auto){
  const s=SIM;

  s.log.unshift({it:c.it, auto, miss:s.stepMiss});
  if(!auto && s.stepMiss===0 && Math.random()<.3) checkerSay(pick(LINES.good), 'ok', false);

  const s=SIM; s.done=true; s.busy=false;

  const prev=S.simBest[s.cl.id];
  if(!prev || s.acc>prev.acc || (s.acc===prev.acc && s.sec<prev.sec)) S.simBest[s.cl.id]={acc:s.acc, sec:s.sec, mode:s.mode};
  s.bad.forEach(sendToReview); Q=null; save();
  renderSim();

  else if(key==='gear'){ fx('motor',2.2); setTimeout(()=>fx('thunk'),2100); s.gearT=Date.now(); }

}
function tween(key, to, ms=800){
  const s=SIM, from=s.st[key], t0=performance.now(); to=Math.max(key==='trim'?-5:0,Math.min(key==='trim'?5:1,to));
  return new Promise(res=>{ const step=now=>{ if(SIM!==s) return res(); const p=Math.min(1,(now-t0)/(RM?1:ms)), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

}

async function perform(c, who){
  if(viewMode()==='3d' && G3 && document.getElementById('g3')) return perform3d(c, who);
  const s=SIM, tok=++s.anim, alive=()=>SIM===s && s.anim===tok;
  const t=c.c?targetOf(c.it,c.c):{k:'say'};
  if(!c.c){ // spoken item: the trainee says it
    checkerSay(who==='inst'?'(המדריך) '+clean(c.it.text):'🗣 '+clean(c.it.text), 'neutral', false);
    await sleep(1300); return alive();
  }
  const key=skey(c.c.id), p=ctlPoint(c.c.id);
  const host=p&&(p.photo?document.getElementById('photoIn'):p.box);
  if(p){
    if(p.photo) camFocus(p.r);
    placeHand(host, who==='inst'?Math.max(0,p.x-40):Math.min(100,p.x+40), Math.min(100,p.y+45), who, true);
    await sleep(p.photo?650:250); if(!alive()) return false;
    placeHand(host, p.x, p.y, who, true);
    await sleep(520); if(!alive()) return false;
  }
  const hand=document.getElementById('hand');
  const press=async(ms=180)=>{ hand&&hand.classList.add('press'); p&&p.el&&p.el.classList.add('pressed'); await sleep(ms); hand&&hand.classList.remove('press'); p&&p.el&&p.el.classList.remove('pressed'); };
  const moveHand=(dy,dx=0)=>{ if(p) placeHand(host, p.x+dx, p.y+dy, who, true); };
  switch(t.k){
    case 'st': await press(); setState(key, t.v); break;
    case 'swap': { await press(); const st=MECH[key].st; setState(key, st[(st.indexOf(s.st[key])+1)%st.length]); break; }
    case 'chk': hand&&hand.classList.add('hold'); await press(700); hand&&hand.classList.remove('hold'); flashBadge(key); break;
    case 'lev': case 'rpm': case 'map': {
      const to=t.k==='lev'?t.v:t.k==='map'?MAPT(t.v):s.st.air?MAPT(25):(t.v-750)/1950, from=s.st[key];
      moveHand(-(to-from)*(p&&p.photo?6:20)); fx('click'); await tween(key, to, 900);
      if(s.st.air && s.st.gear==='UP' && key==='thr' && s.st.thr<.05){ fx('horn',1.6); checkerSay('אזהרת גלגלים – השתק.', 'neutral', false); }
      break;
    }
    case 'cycle':
      if(key==='prop'){ moveHand(6); await tween(key,0,700); moveHand(-6); await tween(key,1,700); }
      else if(key==='trim'){ moveHand(-3); await tween('trim',-2,500); moveHand(3); await tween('trim',2,600); moveHand(0); await tween('trim',0,500); }
      else { await press(); setState(key,'OUT'); s.dip=0; checkerSay('נפילת סל״ד... תקין.', 'neutral', false); await sleep(1300); await press(); setState(key,'IN'); }
      break;
    case 'trimd': moveHand(t.v>0?3:-3); await tween('trim', s.st.trim+t.v, 700); break;
    case 'pull': moveHand(5); fx('click'); await sleep(700); break;
    case 'push': moveHand(-5); fx('click'); await sleep(700); break;
    case 'side': moveHand(0,-5); await sleep(400); moveHand(0,5); await sleep(400); break;
    case 'stir': for(const [dy,dx] of [[-5,0],[5,0],[0,-5],[0,5],[0,0]]){ moveHand(dy,dx); await sleep(260); } break;
    default: hand&&hand.classList.add('hold'); await sleep(700); hand&&hand.classList.remove('hold');
  }
  if(!alive()) return false;
  if(key==='key' && s.cl.id==='engine' && /מצתים/.test(c.it.text)){
    checkerSay('לקחתי. בודק מצתים.', 'neutral');
    s.dip=100; await sleep(1100); s.dip=0; await sleep(500); s.dip=120; await sleep(1100); s.dip=0;
    if(!alive()) return false; checkerSay('מצתים תקינים. החזרתי לך.', 'ok');
  }
  await sleep(300); if(!alive()) return false;
  if(p) placeHand(host, who==='inst'?Math.max(0,p.x-40):Math.min(100,p.x+40), Math.min(100,p.y+50), who, false);
  camFocus(null);
  await sleep(p&&p.photo?450:150);
  return alive();
}

    b.classList.toggle('on', !!m && (m.m==='lev'?v>.5:m.m==='trim'?false:ONV.includes(v)||(k==='flaps'&&v!=='UP'))); });
  const want=c&&c.c&&s.hintOn&&!s.busy?c.c.id:null;

  V.querySelectorAll('.ctl[data-c]').forEach(b=>b.classList.toggle('hint', b.dataset.c===want));
  const q=document.getElementById('qpanel');
  if(q){
    if(c && !c.auto && s.opts.length && !s.busy){

        <div class="sim-opts">${s.opts.map((o,i)=>`<button data-o="${i}" class="${s.wrong.includes(i)?'wrong':''}" ${s.wrong.includes(i)?'disabled':''}><span class="mono dim">${i+1}</span>&nbsp; ${F(o.t)}</button>`).join('')}</div>
        ${s.hintOn&&!c.c?'<div class="mute" style="font-size:13px;margin-top:8px">רמז: זה סעיף קריאה, בלי בקר.</div>':''}`;

    } else q.innerHTML=`<div class="mute" style="text-align:center;padding:6px">${c&&c.auto?'המדריך מבצע…':'מבצע…'}</div>`;
  }
  document.getElementById('slog').innerHTML=s.log.slice(0,4).map(l=>`<div>${l.auto?'<span class="ins">מדריך</span>':l.miss?'<span class="bad">✗</span>':'<b>✓</b>'} ${l.it.n}. ${F(l.it.text)}</div>`).join('');
}
// Animation loop: smoothed RPM drives the needles, readouts, engine sound and panel vibration.
let simRAF=0, auTick=0;
function simLoop(t){
  const s=SIM, v=document.getElementById('vshake');
  if(!s||!s.started||s.done||tab!=='sim'||!v){ simRAF=0; auSet(0,false); return; }
  const dip=s.dip+(s.st.altair==='OUT'&&s.st.run?50:0);
  const target=Math.max(0,engRPM(s.st)-dip);
  s.rpmS+=(target-s.rpmS)*(target<s.rpmS?.08:.035);
  const rpm=Math.round(s.rpmS), map=engMAP(s.st);
  document.getElementById('hRPM').textContent=rpm.toLocaleString('en-US');
  document.getElementById('hMAP').textContent=s.st.run?map.toFixed(1):'–';
  const nr=document.getElementById('nRPM'), nm=document.getElementById('nMAP');
  if(nr) nr.style.transform=`rotate(${-135+Math.min(rpm,3500)/3500*270}deg)`;
  if(nm) nm.style.transform=`rotate(${-135+(Math.max(10,Math.min(35,map))-10)/25*270}deg)`;
  const a=RM?0:rpm?.25+rpm/2700*1.1:0;
  v.style.transform=a?`translate(${(Math.sin(t*.11)*a).toFixed(2)}px,${(Math.cos(t*.17)*a).toFixed(2)}px)`:'';
  if(++auTick%5===0) auSet(rpm, s.st.air);
  simRAF=requestAnimationFrame(simLoop);
}
setInterval(()=>{
  const s=SIM; if(!s||!s.started||s.done||tab!=='sim') return;
  const el=document.getElementById('sTime'); if(el){ const sec=Math.round((Date.now()-s.t0)/1000); el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
  if(s.mode==='check' && !s.busy && Date.now()-s.lastAct>15000){ s.lastAct=Date.now(); checkerSay(pick(LINES.wait), 'glare'); }
  if(Date.now()-s.gearT<2600) simUpdate();
}, 1000);

// ---------- 3D cockpit (three.js r128): a modelled Snunit, laid out from the user's cockpit photo ----------
// World units are metres. Forward is −z, the instrument panel face sits at z=0, the trainee sits on the right (+x).
// Panel positions come from the photo pixel coordinates (PX/PY) so the 3D layout matches the real cockpit.
let G3=null;
function has3D(){ if(!window.THREE) return false; try{ const c=document.createElement('canvas'); return !!(c.getContext('webgl')||c.getContext('experimental-webgl')); }catch(e){ return false; } }
const S3=.0009, PX=px=>(px-780)*S3, PY=py=>1-(py-330)*S3;
const EYE={me:[.36,1.2,.62], inst:[-.36,1.2,.62]};

function build3D(){
  const T=THREE;
  const coarse=matchMedia('(pointer:coarse)').matches;
  const renderer=new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, coarse?1.5:2));   // phones: lighter on GPU memory
  renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=.9;
  renderer.shadowMap.enabled=!coarse; renderer.shadowMap.type=T.PCFSoftShadowMap;
  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(68, 1, .02, 6000);
  const g={T, renderer, scene, camera, parts:{}, upd:[], coarse};
  // A phone can drop the WebGL context (low GPU memory, app switch): the view goes black. three.js restores it if the

// ---- camera: cockpit head-look or an orbit outside; both smooth toward their targets ----
function camUpdate(dt){
  const g=G3, T=THREE, cam=g.cam, k=1-Math.exp(-dt*4.5);
  let pos, look;
  if(cam.mode==='in'){
    cam.yaw+=(cam.tYaw-cam.yaw)*k; cam.pitch+=(cam.tPitch-cam.pitch)*k; cam.fov+=(cam.tFov-cam.fov)*k;
    pos=new T.Vector3(...EYE.me);
    look=pos.clone().add(new T.Vector3(-Math.sin(cam.yaw)*Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw)*Math.cos(cam.pitch)));
    if(cam.lean){ pos=cam.lean.pos.clone(); look=cam.lean.look.clone(); }
  } else {
    cam.az+=(cam.tAz-cam.az)*k; cam.el+=(cam.tEl-cam.el)*k; cam.r+=(cam.tR-cam.r)*k; cam.fov+=(cam.tFov-cam.fov)*k;
    pos=cam.target.clone().add(new T.Vector3(Math.sin(cam.az)*Math.cos(cam.el)*cam.r, Math.sin(cam.el)*cam.r, Math.cos(cam.az)*Math.cos(cam.el)*cam.r));
    pos.y=Math.max(-.3,pos.y); look=cam.target.clone();

  // cross, and a zero-length look vector renders a black frame
  const kk=cam.snap?1:1-Math.exp(-dt*3.2);
  g.camera.position.lerp(pos,kk);
  const want=look.clone().sub(g.camera.position); if(want.lengthSq()<1e-6) want.set(0,0,-1);
  want.normalize(); if(!cam.dir||cam.snap) cam.dir=want.clone(); else cam.dir.lerp(want,kk).normalize();
  if(Math.abs(cam.dir.y)>.995){ cam.dir.z-=.02; cam.dir.normalize(); }
  cam.snap=false; cam.look.copy(g.camera.position).add(cam.dir); g.camera.lookAt(cam.look);
  if(Math.abs(g.camera.fov-cam.fov)>.05){ g.camera.fov=cam.fov; g.camera.updateProjectionMatrix(); }
}
function camInside(){ const c=G3.cam; c.lean=null; c.mode='in'; c.tYaw=0; c.tPitch=-.38; c.tFov=68; c.focus=null; }

const WALK=[[/גוף ימין/,1.35,.2,4.5,[0,.9,1]],[/זנב/,2.6,.25,5,[0,1,4.6]],[/גוף שמאל/,-1.4,.2,4.5,[0,.9,1]],[/כנף שמאל/,-1.0,.45,5,[-2.8,.4,.6]],[/אף/,.1,.2,4.2,[0,.6,-2.0]],[/כנף ימין/,1.0,.45,5,[2.8,.4,.6]],[/סיום/,.7,.25,8,[0,.8,1]]];

// ---- people: arms (two-bone IK), finger poses, instructor head & face ----

const CONTACT={point:[-.028,-.004,.198], grip:[0,-.046,.086], pinch:[-.018,-.013,.15], flat:[0,-.032,.05], relax:[0,-.032,.06]};

const PINCH=new Set(['key','mags','fsel','xpdr','vent']);

function armRest(A){
  const T=THREE, st=SIM&&SIM.st, run=st&&st.run, P=A.P, g=G3;
  if(!P.isInst && run){
    if(A.side>0) return {p:g.stickGrip[1].localToWorld(new T.Vector3(0,.05,0)), pose:'grip', roll:-Math.PI/2, ap:new T.Vector3(0,-.15,-1)};
    return {p:g.parts.thr.at(), pose:'grip', ap:new T.Vector3(.2,-.7,-1)};
  }
  if(P.isInst && A.side<0 && st&&st.air) return {p:g.stickGrip[-1].localToWorld(new T.Vector3(0,.05,0)), pose:'grip', roll:Math.PI/2, ap:new T.Vector3(0,-.15,-1)};
  return {p:P.root.localToWorld(new T.Vector3(A.side*.13,.61,.5)), pose:'flat', ap:new T.Vector3(A.side*.1,-.55,-1)};
